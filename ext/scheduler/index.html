<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Larkul Scheduler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" media="print" onload="this.media='all'">
<script src="/hub-sdk.js"></script>
<style>
/* Layout: Larkul charcoal header band with spaced wordmark, "needs attention" list, then a wall-calendar grid. Palette: white oak, charcoal, brass hardware */
:root{
  --bg:#f6f4f0; --surface:#ffffff; --sunk:#eeeae3; --ink:#26241f; --muted:#6c665c; --line:#ddd7cc;
  --accent:#2b2925; --accent-ink:#ffffff; --accent-soft:#f1e8d6; --brass:#a6814a;
  --head-bg:#1f1e1b; --head-ink:#f4efe6; --head-muted:#b9ad98;
  --ok:#3d7650; --warn:#9a6410; --bad:#a93b2c; --ok-soft:#e1eee3; --warn-soft:#f5e9cf; --bad-soft:#f6dfd9;
  --s-cnc:#45698c; --s-edge:#94683c; --s-paint:#9a4d6d; --s-assembly:#557a45; --s-delivery:#b0812c; --s-install:#5d4f86; --s-finish:#3d7c78; --s-fixup:#b4462f;
  --chip-ink:#ffffff;
  --f-display:"Marcellus","Palatino Linotype","Times New Roman",serif;
  --f-body:"Nunito Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161513; --surface:#1f1e1b; --sunk:#292723; --ink:#eee9e0; --muted:#a69e90; --line:#3a3732;
  --accent:#d6b47a; --accent-ink:#1a1814; --accent-soft:#3a3122; --brass:#d6b47a;
  --head-bg:#0f0e0d; --head-ink:#f4efe6; --head-muted:#b9ad98;
  --ok:#6cc08a; --warn:#e0a640; --bad:#ec7a68; --ok-soft:#1e3426; --warn-soft:#3a2f17; --bad-soft:#3e211c;
  --s-cnc:#4f77a0; --s-edge:#a2733f; --s-paint:#ad5a7c; --s-assembly:#5f8a4c; --s-delivery:#b8862f; --s-install:#6f60a0; --s-finish:#4c958f; --s-fixup:#c65438;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161513; --surface:#1f1e1b; --sunk:#292723; --ink:#eee9e0; --muted:#a69e90; --line:#3a3732;
  --accent:#d6b47a; --accent-ink:#1a1814; --accent-soft:#3a3122; --brass:#d6b47a;
  --head-bg:#0f0e0d; --head-ink:#f4efe6; --head-muted:#b9ad98;
  --ok:#6cc08a; --warn:#e0a640; --bad:#ec7a68; --ok-soft:#1e3426; --warn-soft:#3a2f17; --bad-soft:#3e211c;
  --s-cnc:#4f77a0; --s-edge:#a2733f; --s-paint:#ad5a7c; --s-assembly:#5f8a4c; --s-delivery:#b8862f; --s-install:#6f60a0; --s-finish:#4c958f; --s-fixup:#c65438;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
ul.files{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.frow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.frow a{color:var(--ink);font-weight:700;overflow-wrap:anywhere;flex:1 1 180px}
.frow .small{margin-left:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head-bg)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1300px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head-bg);color:var(--head-ink);border-bottom:3px solid var(--brass)}
.bar{display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;padding-block:10px}
.brand{margin-right:auto;display:flex;flex-direction:column;line-height:1.1}
.brand .word{font-family:var(--f-display);font-size:28px;letter-spacing:.32em;margin-right:-.32em}
.brand .tag{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--head-muted);margin-top:4px}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{font:700 13px var(--f-body);letter-spacing:.14em;text-transform:uppercase;border:0;border-bottom:2px solid transparent;background:none;color:var(--head-muted);padding:10px 12px;cursor:pointer}
nav button:hover{color:var(--head-ink)}
nav button[aria-selected="true"]{color:var(--head-ink);border-bottom-color:var(--brass)}
.hstat{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--head-muted)}
.hstat .err{color:#ff9d8c;font-weight:700}
.hbtn{font:700 12px var(--f-body);letter-spacing:.1em;text-transform:uppercase;background:none;color:var(--head-ink);border:1px solid var(--head-muted);border-radius:3px;padding:5px 10px;cursor:pointer}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
main{padding-block:20px 80px;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
h2{font-family:var(--f-display);font-weight:400;font-size:24px;letter-spacing:.12em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font-family:var(--f-body);font-weight:800;font-size:12px;letter-spacing:.18em;text-transform:uppercase;margin:0;color:var(--brass)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:14px}
.note{font-size:14px;color:var(--muted);margin:0}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:3px;cursor:pointer;font-weight:700}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{padding:12px 22px;font-size:14px;letter-spacing:.12em;text-transform:uppercase}
.btn.sm{padding:3px 10px;font-size:14px}
.btn.danger{color:var(--bad)} .btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--brass)}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.done{background:var(--sunk);color:var(--muted)} .pill.size{background:var(--accent-soft);color:var(--ink)}
.dot{display:inline-block;width:12px;height:12px;border-radius:3px;flex:none}
.banner{background:var(--accent-soft);border-radius:4px;padding:12px 14px;display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
/* attention list */
.alerts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.alerts li{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:8px 12px;border-radius:4px;background:var(--sunk);font-size:15px}
.alerts li.bad{background:var(--bad-soft)} .alerts li.warn{background:var(--warn-soft)} .alerts li.ok{background:var(--ok-soft)}
.alerts .pill{background:var(--surface)}
.alerts li>span:nth-child(2){flex:1 1 240px;min-width:0}
/* calendar */
.calhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0;flex:1 1 260px}
.calhead h2{min-width:0;text-align:center}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.legend span{display:flex;gap:6px;align-items:center}
.cal{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dow{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--sunk)}
.day{min-height:100px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.day.out,.day.off{background:var(--sunk)} .day.out .num{opacity:.5}
.day .num{font-weight:700;font-size:15px;padding:0 4px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.day .closed{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day.today .num b{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 8px}
.chip{display:flex;gap:6px;align-items:center;width:100%;text-align:left;border:0;border-radius:4px;padding:3px 7px;font-size:13px;font-weight:700;line-height:1.25;color:var(--chip-ink);cursor:pointer;min-width:0;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.chip[data-drag]{cursor:grab;touch-action:pan-y;-webkit-touch-callout:none;user-select:none}
.chip .pin{flex:none;font-size:11px;opacity:.9}
.dragging,.dragging *{cursor:grabbing!important;user-select:none!important}
.dragghost{position:fixed;z-index:50;pointer-events:none;max-width:220px;opacity:.92;box-shadow:0 6px 18px rgba(0,0,0,.28);transform:rotate(-2deg)}
.chip.lifted,.jcard.lifted{opacity:.35}
.day.dropto{background:var(--accent-soft,rgba(0,0,0,.06));box-shadow:inset 0 0 0 2px var(--accent)}
.jcard.dropto{box-shadow:0 -3px 0 0 var(--accent)}
.jcard.dropto.below{box-shadow:0 3px 0 0 var(--accent)}
.jcard .grip{cursor:grab;color:var(--muted);font-size:18px;line-height:1;padding:0 2px;touch-action:none;user-select:none}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip em{font-style:normal;font-weight:400;opacity:.92;margin-left:auto;padding-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.chip.due{background:none;color:var(--ok);padding:1px 4px;font-size:12px;text-shadow:none;border-top:1px dashed currentColor;border-radius:0}
.chip.due.late{color:var(--bad);border-color:var(--bad)}
.cal.focus .chip:not(.sel){opacity:.22}
.dname{display:none}
@media (max-width:700px){
  .cal{display:block;border:0}
  .cal .dow{display:none}
  .day{min-height:0;border:1px solid var(--line);border-radius:4px;margin-bottom:8px}
  .day.empty,.day.out{display:none}
  .calwrap .day{min-height:0}
  .dname{display:inline;font-weight:400;color:var(--muted);margin-left:6px}
}
/* jobs */
.jobs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:20px;align-items:start}
@media (max-width:900px){.jobs{grid-template-columns:minmax(0,1fr)}}
.jlist{display:grid;gap:8px}
.jcard{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.jcard[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.jcard .nm{font-weight:800;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.step.done{background:var(--sunk);text-decoration:line-through}
.step.next{color:var(--ink);border-color:var(--ink)}
.mini{display:flex;gap:3px}
.mini i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.form .wide{grid-column:1/-1}
label.f{display:grid;gap:4px;font-size:14px;font-weight:700;color:var(--muted);align-content:start}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:3px;padding:8px 10px;color:var(--ink);width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
label.chk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:700}
label.chk input[type=checkbox]{width:20px;height:20px}
label.chk input[type=number]{width:80px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.parts{display:grid;gap:8px}
.counts{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.aibox{border:1px dashed var(--brass);border-radius:8px;padding:14px;display:grid;gap:10px;background:var(--surface)}
.aibox ul{margin:0;padding-left:20px}
.note.err{color:var(--bad)}
.proposal{border:1px solid var(--brass);background:var(--accent-soft);border-radius:8px;padding:12px 14px;display:grid;gap:8px}
.proposal ul{margin:0;padding-left:20px}
.msgs{display:grid;gap:10px;max-height:min(60vh,560px);overflow:auto;padding:4px}
.msg{padding:10px 12px;border-radius:10px;max-width:85%;overflow-wrap:anywhere}
.msg .t{white-space:pre-wrap}
.msg.me{justify-self:end;background:var(--accent);color:var(--accent-ink)}
.msg.cl{justify-self:start;background:var(--sunk);color:var(--ink)}
.msg .changes{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:4px;white-space:normal}
.msg .changes label{display:flex;gap:8px;align-items:flex-start}
.chatin{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.chatin textarea{min-height:56px}
.part{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,.7fr) auto;gap:6px 10px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
@media (max-width:600px){.part{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
details summary{cursor:pointer;font-weight:700;color:var(--muted)}
details[open] summary{margin-bottom:8px}
.scroll{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:700}
td input[type=number]{width:90px}
tr.isdone td{color:var(--muted)}
.fixbox{background:var(--accent-soft);border-radius:4px;padding:12px 14px}
.fixups select{min-width:110px}
.typegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.typebtn{display:grid;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--surface);cursor:pointer}
.typebtn b{font-size:15px}
.typebtn span{font-size:13px;color:var(--muted)}
.typebtn[aria-pressed="true"]{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass);background:var(--accent-soft)}
.preview{background:var(--sunk);border-radius:4px;padding:12px 14px;display:grid;gap:6px}
.preview ul{margin:0;padding-left:20px}
/* materials */
.mats{display:grid;gap:8px}
.mat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.mat.bad{border-left:5px solid var(--bad)} .mat.warn{border-left:5px solid var(--warn)} .mat.ok{border-left:5px solid var(--ok)}
.mat .nm{font-weight:800;font-size:16px}
.recv{display:flex;gap:6px;flex-wrap:wrap} .recv input{width:90px}
@media (max-width:600px){.mat{grid-template-columns:minmax(0,1fr)}}
.daysoff{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--head-bg);color:var(--head-ink);border:1px solid var(--brass);border-radius:4px;padding:10px 14px;display:flex;gap:14px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);pointer-events:none}
.toast button{background:none;border:0;color:var(--brass);font-weight:800;cursor:pointer;text-transform:uppercase;letter-spacing:.1em;font-size:13px;pointer-events:auto}
@media (prefers-reduced-motion:no-preference){.chip,.btn,.jcard,.typebtn{transition:opacity .15s,border-color .15s}}
/* calendar + job list side by side */
.calwrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
.calwrap>.panel{gap:12px}
.side{position:sticky;top:96px;max-height:calc(100vh - 110px);overflow:auto;padding:14px}
.side h2{font-size:18px}
.jside{display:grid;gap:6px}
.idays{display:flex;align-items:center;gap:6px;margin:-2px 0 4px 30px}
.idays .ibtn{width:26px;height:26px;padding:0}
.awaybox{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;border-radius:4px}
.awaybox h3{margin:0 0 4px}
.awaybox.dropto{background:var(--accent-soft,rgba(0,0,0,.06));box-shadow:inset 0 0 0 2px var(--accent)}
body.dragging .awaybox{outline:2px dashed var(--line);outline-offset:4px}
.jrow.held{border-style:dashed}
.jrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);border-left-width:1px;background:var(--surface);border-radius:4px;padding:8px 10px;cursor:grab;touch-action:pan-y;-webkit-touch-callout:none;user-select:none}
.jrow:hover{border-color:var(--muted)}
.jrow.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.jrow .jt{display:grid;min-width:0;flex:1}
.jrow .jt b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jrow .jt .small{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jrow.lifted{opacity:.35}
.calwrap .day{min-height:80px;padding:4px}
.calwrap .chip{font-size:12px;padding:2px 6px}
.calwrap .day .num{font-size:13px}
.calwrap .cal .dow{padding:6px 8px;font-size:12px}
.calwrap .legend{font-size:13px}
.calwrap .calhead h2{font-size:20px;flex:0 1 auto}
.day.other{background:var(--sunk)} .day.other .num{opacity:.45}
@media (max-width:980px){.calwrap{grid-template-columns:minmax(0,1fr)}.side{position:static;max-height:none}}
/* bills */
.sidecol{display:grid;gap:16px;align-content:start;position:sticky;top:96px;max-height:calc(100vh - 110px);overflow:auto}
.sidecol .side{position:static;max-height:none;overflow:visible}
.seg{display:flex;gap:0}
.seg .btn{border-radius:0;margin-left:-1px}
.seg .btn:first-child{border-radius:3px 0 0 3px;margin-left:0}
.seg .btn:last-child{border-radius:0 3px 3px 0}
.chip.bill{background:var(--surface);color:var(--ink);border:1px solid var(--brass);text-shadow:none}
.chip.bill em{font-style:normal;font-weight:700;color:var(--brass);margin-left:auto;padding-left:4px;white-space:nowrap}
.chip.bill.paid{opacity:.55;text-decoration:line-through}
.chip.bill.late{border-color:var(--bad)} .chip.bill.late em{color:var(--bad)}
.chip.bill.sel{box-shadow:0 0 0 2px var(--brass)}
.billdot{background:var(--surface);border:1px solid var(--brass)}
.btotal{display:flex;justify-content:space-between;align-items:baseline;background:var(--sunk);border-radius:4px;padding:8px 10px;font-size:14px}
.btotal b{font-size:18px}
.brow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:var(--surface)}
.brow input{width:18px;height:18px;flex:none}
.brow .bt{display:grid;flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;cursor:pointer;color:inherit}
.brow .bt b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bt .small{font-size:12px}
.brow .amt{font-weight:800;font-size:14px;white-space:nowrap}
.brow.paid{opacity:.6} .brow.paid .bt b{text-decoration:line-through}
.brow.late{border-color:var(--bad)} .brow.late .amt{color:var(--bad)}
.billedit{display:grid;gap:8px;border:1px solid var(--brass);border-radius:4px;padding:10px;background:var(--accent-soft)}
.billedit .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:8px}
@media (max-width:980px){.sidecol{position:static;max-height:none}}
@media (min-width:981px){.billedit .two{grid-template-columns:minmax(0,1fr)}}
/* jobs from Cabinet Designer */
.cdbox{display:grid;gap:8px;border:1px solid var(--brass);border-radius:4px;padding:10px;background:var(--accent-soft)}
.cdbox h3{margin:0;font-size:15px}
.cdrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
/* calendar titles and step labels on chips */
.ctitle{font-size:15px;letter-spacing:.12em;color:var(--muted);margin:0}
.calwrap .chip em{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;opacity:.95}
.calwrap .day{min-height:92px}
/* name on the first line, the step under it, so nothing gets cut off */
.calwrap .chip:not(.due):not(.bill){flex-wrap:wrap;row-gap:0;padding:3px 7px 4px}
.calwrap .chip:not(.due):not(.bill) span{flex:1 1 auto;min-width:0}
.calwrap .chip:not(.due):not(.bill) em{flex:1 0 100%;margin:0;padding:0;max-width:none;font-size:10.5px;line-height:1.2}
/* paste a list */
.bulk textarea{width:100%;min-height:140px;font:inherit}
.bulkt td,.bulkt th{vertical-align:middle}
.bulkt select{min-width:110px;max-width:170px}
.bulkt tr.off td{opacity:.5}
.bulkt input[type=checkbox]{width:18px;height:18px}
.warnc{color:var(--warn)}
/* tidy-up pass */
.lbl{font-size:14px;font-weight:700;color:var(--muted)}
.hint{font-size:12px;font-weight:400;color:var(--muted)}
.inl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end}
.inl label.f{flex:0 0 auto}
input.n{width:110px}
.form h3{margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
.form h3:first-child{margin-top:0;padding-top:0;border-top:0}
.checks{display:grid;gap:8px;align-content:end;padding-bottom:6px}
select.addpart{width:100%;max-width:340px}
.inl{min-width:0}
details.sub{border:1px solid var(--line);border-radius:4px;padding:8px 12px}
details.sub[open]{padding-bottom:12px}
details.fold{padding:0;gap:0}
details.fold>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer;color:inherit}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary .ft{display:grid;gap:2px;flex:1;min-width:0}
details.fold>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 4px 0 0;flex:none}
details.fold[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
details.fold[open]>summary{margin-bottom:0;border-bottom:1px solid var(--line)}
details.fold>.fbody{padding:16px 18px 18px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.ibtn{border:1px solid var(--line);background:var(--surface);border-radius:3px;width:28px;height:26px;line-height:1;cursor:pointer;color:var(--muted);font-weight:800}
.ibtn:hover{color:var(--ink);border-color:var(--muted)}
.more{background:none;border:0;padding:4px 0;color:var(--muted);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.mat .facts{font-size:15px}
details summary .note,details summary .small{font-weight:400}
.recv .btn{padding:6px 12px;font-size:14px}
@media (max-width:640px){
  .bar{gap:2px 12px;padding-block:8px 0}
  .brand .word{font-size:22px}
  nav{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  nav button{padding:10px 7px;white-space:nowrap;font-size:12px;letter-spacing:.08em}
  #saveState{display:none}
  .calhead .btn.sm{order:5}
  .calhead h2{font-size:17px;letter-spacing:.08em}
  .panel{padding:14px}
}

<script>
'use strict';
const STEPS=['cnc','edge','paint','assembly','delivery','install','finish'];
const SHOP_STEPS=['cnc','edge','paint','assembly','delivery','finish'];
const STEP_NAME={cnc:'CNC',edge:'Edgebanding',paint:'Paint',assembly:'Assembly',delivery:'Delivery',install:'Install',finish:'Finish',fixup:'Fix-up'};

/* ---------- dates (local, YYYY-MM-DD) ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
let OFF=new Set();
const isWork=s=>{const g=parse(s).getDay();return g!==0&&(g!==6||state.settings.saturdays)&&!OFF.has(s)};
const nextWork=s=>{let g=0;while(!isWork(s)&&g++<400)s=addDays(s,1);return s};
const prevWork=s=>{let g=0;while(!isWork(s)&&g++<400)s=addDays(s,-1);return s};
const addWork=(s,n)=>{if(n>=0){s=nextWork(s);for(;n>0;n--)s=nextWork(addDays(s,1))}else{s=prevWork(s);for(;n<0;n++)s=prevWork(addDays(s,-1))}return s};
const workBetween=(a,b)=>{if(a===b)return 0;let sign=1;if(a>b){[a,b]=[b,a];sign=-1}let n=0;while(a<b){a=addDays(a,1);if(isWork(a))n++}return n*sign};
const fmt=s=>s?parse(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}):'—';
const fmtS=s=>parse(s).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const TODAY=iso(new Date());
const isDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);
const r1=x=>Math.round(x*10)/10;
const num=(x,d=0)=>{const n=+x;return Number.isFinite(n)?n:d};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function plural(n,u){
  if(n===1||['ft','gal','each','lbs','qt'].includes(u))return `${n} ${u}`;
  if(u==='shelf')return `${n} shelves`;
  return `${n} ${/(s|x|ch|sh)$/.test(u)?u+'es':u+'s'}`;
}
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- defaults ---------- */
function defaultStations(){return [
  {id:'cnc',name:'CNC router',hoursPerDay:10},{id:'edge',name:'Edgebander',hoursPerDay:8},
  {id:'paint',name:'Paint booth',hoursPerDay:8},{id:'assembly',name:'Assembly',hoursPerDay:8},
  {id:'delivery',name:'Delivery truck',hoursPerDay:8},{id:'finish',name:'Finish crew',hoursPerDay:8}]}
function defaultMaterials(){return [
  {id:'m1',name:'3/4" prefinished maple ply',unit:'sheet',onHand:100,reorder:15,lead:5,step:'cnc'},
  {id:'m2',name:'1/4" maple ply (backs)',unit:'sheet',onHand:30,reorder:6,lead:5,step:'cnc'},
  {id:'m3',name:'3/4" MDF (paint-grade doors)',unit:'sheet',onHand:30,reorder:6,lead:3,step:'cnc'},
  {id:'m4',name:'Maple edgebanding 15/16"',unit:'ft',onHand:5000,reorder:600,lead:7,step:'edge'},
  {id:'m5',name:'Primer',unit:'gal',onHand:8,reorder:2,lead:4,step:'paint'},
  {id:'m6',name:'Paint (white conversion varnish)',unit:'gal',onHand:6,reorder:3,lead:4,step:'paint'},
  {id:'m7',name:'Soft-close hinges',unit:'hinge',onHand:300,reorder:60,lead:5,step:'assembly'},
  {id:'m8',name:'Drawer slides',unit:'pair',onHand:100,reorder:20,lead:7,step:'assembly'},
  {id:'m9',name:'Floating shelf brackets',unit:'bracket',onHand:30,reorder:10,lead:10,step:'assembly'}]}
const CAB_MATS=()=>({m1:{u:0.9},m2:{u:0.25},m3:{p:0.4},m4:{u:28},m5:{p:0.12},m6:{p:0.2},m7:{u:2.5},m8:{u:0.8}});
/* Ayden's numbers (Oct 2026): CNC 10 h/day (small kitchen 1 day, larger 2-3), edgebander 8 h/day (most jobs half a day to a day),
   paint 8 h/day (usually 2 days), assembly 8 h/day (small jobs about 2 days to be safe). Each size sets days per step.
   Kitchen size comes from the total cabinet count: up to about 15 small, 17-25 medium, more is large (16 counts as small). */
const Z=(id,name,typical,cnc,edge,paint,assembly,installDays,max=9999)=>({id,name,max,typical,days:{cnc,edge,paint,assembly},installDays});
const T=(id,name,unit,deliveryHours,install,mats,sizes)=>({id,name,unit,hours:{delivery:deliveryHours},deliver:true,install,mats,sizes});
/* Finish (Oct 2026): trim, crown, scribe and touch-ups on site after install. A first guess of about half the install time. */
const finishGuess=(t,z)=>t.install&&num(z.installDays)>0?Math.max(0.5,Math.round(num(z.installDays))/2):0;
const withFinish=ts=>ts.map(t=>{t.sizes.forEach(z=>{z.days.finish=finishGuess(t,z)});return t});
function defaultTypes(){return withFinish([
  T('kitchen','Kitchen','cabinet',3,true,CAB_MATS(),[Z('s','Small',12,1,0.5,2,2,2,16),Z('m','Medium',21,2,1,2,3,2.5,25),Z('l','Large',32,3,1,3,4,3)]),
  T('bath','Bathroom / vanity','cabinet',2,true,CAB_MATS(),[Z('one','',4,0.5,0.5,1,1,1)]),
  T('laundry','Laundry / mudroom','cabinet',2,true,CAB_MATS(),[Z('one','',8,1,0.5,1.5,1.5,1)]),
  T('builtin','Built-in / entertainment','cabinet',2,true,CAB_MATS(),[Z('one','',6,1,0.5,1.5,2,1.5)]),
  T('shelves','Floating shelves','shelf',1.5,false,{m1:{u:0.35},m4:{u:12},m5:{p:0.05},m6:{p:0.1},m9:{u:2}},[Z('one','',6,0.5,0.5,1,1,0.5)]),
  T('hood','Range hood','hood',1.5,true,{m1:{u:1.5},m3:{p:1},m4:{u:40},m5:{p:0.3},m6:{p:0.5}},[Z('one','',1,0.5,0.25,1,1,0.5)]),
  T('mantel','Mantel','mantel',1.5,true,{m1:{u:0.75},m4:{u:20},m5:{p:0.2},m6:{p:0.3}},[Z('one','',1,0.25,0.25,1,0.5,0.5)]),
  T('other','Other / custom','piece',2,false,{m1:{u:0.5},m4:{u:15}},[Z('one','',1,0.5,0.5,1,1,1)]),
  ...newTypes()])}
/* rev 5: the job types Ayden uses for real jobs (Oct 2026). Days are a first guess to change in Settings. */
function newTypes(){return [
  T('house','Whole house','cabinet',4,true,CAB_MATS(),[Z('xs','Very small',15,1,0.5,2,2,2,20),Z('s','Small',25,2,1,2,3,3,30),Z('m','Medium',40,3,1.5,3,4,4,50),Z('l','Large',60,4,2,4,6,5)]),
  T('finish','Finish','piece',1.5,true,{m1:{u:0.5},m4:{u:15},m5:{p:0.1},m6:{p:0.15}},[Z('xs','Very small',2,0.25,0.25,1,0.5,0.5,3),Z('s','Small',5,0.5,0.5,1,1,1,8),Z('m','Medium',10,1,0.5,2,2,1.5,15),Z('l','Large',20,1.5,1,2,3,2)]),
  T('parts','Parts only','part',1,false,{m1:{u:0.1},m4:{u:4}},[Z('xs','Very small',10,0.25,0.25,0,0,0,20),Z('s','Small',30,0.5,0.5,0,0,0,50),Z('m','Medium',80,1,1,0,0,0,120),Z('l','Large',150,2,1.5,0,0,0)]),
  T('custom','Custom','piece',2,true,{m1:{u:0.5},m4:{u:15},m5:{p:0.1},m6:{p:0.15}},[Z('xs','Very small',1,0.25,0.25,1,0.5,0.5,1),Z('s','Small',2,0.5,0.5,1,1,1,3),Z('m','Medium',5,1,0.5,2,2,1.5,8),Z('l','Large',10,1.5,1,2,3,2)]),
  T('room','Room','cabinet',2,true,CAB_MATS(),[Z('xs','Very small',4,0.5,0.5,1,1,1,5),Z('s','Small',8,1,0.5,1.5,2,1.5,10),Z('m','Medium',15,1.5,1,2,3,2,20),Z('l','Large',25,2,1,3,4,3)])]}
const COUNT_KEYS=['cabinets','fillers','panels','doors','drawerFronts','drawers'];
const COUNT_NAME={cabinets:'Cabinets',fillers:'Fillers',panels:'Panels',doors:'Doors',drawerFronts:'Drawer fronts',drawers:'Drawers'};
const defaultComplexity=()=>[{id:'low',name:'Low',pct:0},{id:'med',name:'Medium',pct:25},{id:'high',name:'High',pct:50}];
function freshState(){return {v:4,settings:{saturdays:false,paintDryDays:1,installCrews:1,daysOff:[],defaultsRev:6,installGap:2,deliverWithInstall:true,hubReminders:true,complexity:defaultComplexity()},stations:defaultStations(),materials:defaultMaterials(),types:defaultTypes(),jobs:[]}}
function exampleJobs(){
  const due=n=>addWork(TODAY,n);
  const J=(o)=>({id:uid('j'),customer:'',painted:0,deliver:true,install:true,done:{},hours:{},fixups:[],notes:'',example:true,...o});
  return [
    J({name:'Henderson kitchen',customer:'Mark & Lisa Henderson',type:'kitchen',size:'m',count:24,painted:8,due:due(9),done:{cnc:true}}),
    J({name:'Lakeview floating shelves',customer:'Lakeview Builders',type:'shelves',count:6,due:due(5),install:false}),
    J({name:'Ortiz bathroom vanities',customer:'Ortiz family',type:'bath',count:5,painted:5,due:due(7)}),
    J({name:'Patel kitchen + island',customer:'Raj Patel',type:'kitchen',size:'l',count:34,painted:34,due:due(13)}),
    J({name:'Brookside laundry cabinets',customer:'Brookside Remodeling',type:'laundry',count:9,due:due(12),install:false}),
    J({name:'Reyes range hood',customer:'Carmen Reyes',type:'hood',count:1,painted:1,due:due(10)}),
    J({name:'Nguyen kitchen',customer:'Anh Nguyen',type:'kitchen',size:'s',count:14,due:due(20)}),
    J({name:'Miller kitchen',customer:'Dana Miller',type:'kitchen',size:'m',count:22,painted:22,due:due(-3),done:{cnc:true,edge:true,paint:true,assembly:true,delivery:true,install:true,finish:true},
      fixups:[{id:uid('f'),note:'Replace scratched pantry door, adjust 2 drawer fronts',days:0.5,date:'',done:false}]})];
}

/* ---------- state + saving ---------- */
const KEY='larkul-schedule-v4';
const APP=typeof window.Neutralino!=='undefined'&&typeof window.NL_PORT!=='undefined';
/* inside the Extension Hub (http://localhost:4321): data in Hub.storage, documents in the Files library under Schedules/, dates as hub reminders */
const HUB=!APP&&typeof window.Hub!=='undefined';
const LIB='Schedules';
let calSlim=false,state=freshState(),tab='calendar',selJob=null,focusJob=null,armed=null,weekOff=0,monthOff=null,calShow='jobs',selBill=null,q='',jf='active',selType='kitchen',draft=null;
let undoStack=[],lastJSON='',dataDir=null,saveTimer=null,savePending=false,backupDay=null;
const WEEKS=4;

function normalize(st){
  const f=freshState();
  st=st&&typeof st==='object'?st:{};
  st.v=4;
  const rev=num(st.settings&&st.settings.defaultsRev);
  st.settings={...f.settings,...(st.settings||{})};
  if(!Array.isArray(st.settings.daysOff))st.settings.daysOff=[];
  st.settings.daysOff=st.settings.daysOff.filter(isDate);
  if(!Array.isArray(st.settings.complexity)||!st.settings.complexity.length)st.settings.complexity=defaultComplexity();
  st.settings.complexity=st.settings.complexity.filter(x=>x&&typeof x==='object').map(x=>({id:x.id||uid('c'),name:String(x.name??''),pct:Math.max(0,num(x.pct))}));
  st.stations=f.stations.map(d=>({...d,...((st.stations||[]).find(x=>x&&x.id===d.id)||{})}));
  st.materials=Array.isArray(st.materials)&&st.materials.length?st.materials:f.materials;
  st.types=Array.isArray(st.types)&&st.types.length?st.types:f.types;
  /* switch saved data to Ayden's real shop numbers, but only where the old starting guess was never changed */
  if(rev<2){
    const swap=(o,k,from,to)=>{if(o&&num(o[k],-1)===from)o[k]=to};
    swap(st.stations.find(x=>x.id==='cnc'),'hoursPerDay',8,10);
    swap(st.stations.find(x=>x.id==='assembly'),'hoursPerDay',16,8);
    for(const t of st.types)if(['kitchen','bath','laundry','builtin'].includes(t.id)&&t.hours){swap(t.hours,'cnc',0.3,0.75);swap(t.hours,'paint',0.75,0.7)}
    st.settings.defaultsRev=2;
  }
  /* rev 3: job time comes from days per step for each size instead of hours per cabinet */
  const oldTier=(t,count)=>{
    if(!t.sizes.some(x=>x.max!=null))return [...t.sizes].sort((a,b)=>Math.abs(num(a.typical)-count)-Math.abs(num(b.typical)-count))[0];
    const z=[...t.sizes].sort((a,b)=>num(a.max,9999)-num(b.max,9999));return z.find(x=>count<=num(x.max,9999))||z[z.length-1]};
  if(rev<3){
    const defs=defaultTypes();
    for(const t of st.types){
      if(!Array.isArray(t.sizes)||!t.sizes.length)t.sizes=[{name:'',max:9999,typical:1,installDays:1}];
      const d=defs.find(x=>x.id===t.id);
      t.sizes.forEach((z,k)=>{
        const dz=d&&(d.sizes.find(x=>x.name.toLowerCase()===String(z.name||'').toLowerCase())||d.sizes[Math.min(k,d.sizes.length-1)]);
        if(!z.id)z.id=dz&&!t.sizes.some(x=>x.id===dz.id)?dz.id:uid('z');
        if(!z.days){
          if(dz)z.days={...dz.days};
          else{const h=t.hours||{},n=num(z.typical,1),day=s=>Math.max(0,Math.round(num(h[s])*n/num((st.stations.find(x=>x.id===s)||{}).hoursPerDay,8)*2)/2);
            z.days={cnc:Math.max(day('cnc'),num(h.cnc)>0?0.5:0),edge:day('edge'),paint:day('paint'),assembly:day('assembly')}}
        }
      });
    }
    for(const j of Array.isArray(st.jobs)?st.jobs:[]){
      if(!j||typeof j!=='object')continue;
      const t=st.types.find(x=>x.id===j.type);
      if(j.hours&&typeof j.hours==='object'){j.days=j.days||{};
        for(const s of ['cnc','edge','paint','assembly'])if(j.hours[s]!=null&&j.hours[s]!==''){j.days[s]=Math.max(0.25,Math.round(num(j.hours[s])/num((st.stations.find(x=>x.id===s)||{}).hoursPerDay,8)*4)/4);delete j.hours[s]}}
    }
    st.settings.defaultsRev=3;
  }
  if(rev<4){
    const k=st.types.find(x=>x.id==='kitchen');
    if(k&&Array.isArray(k.sizes)){
      const set=(id,max,from,typical)=>{const z=k.sizes.find(x=>x.id===id);if(z){if(z.max==null||num(z.max)===from)z.max=max;if(num(z.typical)===({s:12,m:22,l:35})[id])z.typical=typical}};
      set('s',16,15,12);set('m',25,28,21);set('l',9999,9999,32);
    }
    st.settings.defaultsRev=4;
  }
  if(rev<5){for(const t of newTypes())if(!st.types.some(x=>x&&x.id===t.id))st.types.push(t);st.settings.defaultsRev=5}
  if(rev<6){/* rev 6 adds the Finish step: a Finish crew, and finish days for every size of job type that's installed */
    if(Array.isArray(st.stations)&&!st.stations.some(x=>x&&x.id==='finish'))st.stations.push({id:'finish',name:'Finish crew',hoursPerDay:8});
    for(const t of st.types)if(t&&Array.isArray(t.sizes))for(const z of t.sizes)if(z&&(!z.days||z.days.finish==null))z.days={...(z.days||{}),finish:finishGuess(t,z)};
    st.settings.defaultsRev=6}
  for(const t of st.types){
    t.hours={delivery:num((t.hours||{}).delivery,2)};t.mats=t.mats||{};t.unit=t.unit||'piece';
    if(!Array.isArray(t.sizes)||!t.sizes.length)t.sizes=[{id:'one',name:'',typical:1,days:{cnc:0.5,edge:0.5,paint:1,assembly:1},installDays:1}];
    const d=defaultTypes().find(x=>x.id===t.id);
    t.sizes.forEach((z,k)=>{if(!z.id)z.id=uid('z');z.days={cnc:0,edge:0,paint:0,assembly:0,finish:0,...(z.days||{})};
      if(z.max==null||z.max===''){const dz=d&&d.sizes.find(x=>x.id===z.id);z.max=dz?dz.max:9999}});
  }
  st.bills=(Array.isArray(st.bills)?st.bills:[]).filter(b=>b&&typeof b==='object').map(b=>({id:b.id||uid('b'),name:String(b.name??''),amount:Math.max(0,num(b.amount)),
    due:isDate(b.due)?b.due:TODAY,repeat:REPEATS.some(r=>r[0]===b.repeat)?b.repeat:'none',paid:Array.isArray(b.paid)?b.paid.filter(isDate):[],notes:String(b.notes||'')}));
  st.jobs=(Array.isArray(st.jobs)?st.jobs:[]).filter(j=>j&&typeof j==='object').map(j=>({customer:'',painted:0,deliver:true,install:true,notes:'',...j,
    id:j.id||uid('j'),name:j.name||'Untitled job',type:st.types.some(t=>t.id===j.type)?j.type:st.types[st.types.length-1].id,
    count:Math.max(0,num(j.count,1)),painted:Math.max(0,num(j.painted)),done:j.done&&typeof j.done==='object'?j.done:{},hours:j.hours&&typeof j.hours==='object'?j.hours:{},days:j.days&&typeof j.days==='object'?j.days:{},

/* one copy a day in Files > Schedules > Backups, last 30 kept */
async function hubBackup(){
  const dir=LIB+'/Backups',name=`larkul-${TODAY}.json`;
  let list=[];try{list=await Hub.files.list(dir)}catch(e){try{await Hub.files.mkdir(LIB)}catch(_){}try{await Hub.files.mkdir(dir)}catch(_){}}

function fileList(files){try{const dt=new DataTransfer();files.forEach(f=>dt.items.add(f));return dt.files}catch(e){return files}}
async function flushSave(){

/* the planned end of every step not yet done, kept so the next day can tick off the ones whose day has passed */
function rememberPlan(){
  try{const sch=schedule(),plan={};
    for(const j of state.jobs){const r=sch[j.id];if(!r)continue;const m={};for(const st of r.stages)if(!st.done&&st.end)m[st.s]=st.end;if(Object.keys(m).length)plan[j.id]=m}
    state.plan={day:TODAY,jobs:plan};
  }catch(e){console.error(e)}
}
/* steps whose planned day has passed are marked done, in order, the way the shop usually runs; click a step to reopen it */
function autoAdvance(){
  if(state.settings.autoDone===false||!state.plan||!state.plan.jobs||!(state.plan.day<TODAY))return [];
  const out=[];
  for(const j of state.jobs){
    const m=state.plan.jobs[j.id];if(!m)continue;
    for(const s of STEPS){
      if(!applies(j,s)||j.done[s]||j.hold)continue;
      if(!(isDate(m[s])&&m[s]<TODAY)){if(s==='paint')continue;break}
      if(s==='install'&&isDate(j.installStart)&&j.installStart>=TODAY)break;
      toggleStage(j,s);(j.autoDone=j.autoDone||{})[s]=TODAY;out.push(`${STEP_NAME[s]} for ${j.name}`);
    }
  }
  return out;
}
function save(){
  rememberPlan();lastJSON=JSON.stringify(state); /* the plan isn't an edit of its own, so it never makes an undo step */
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
  if(APP||HUB){savePending=true;setSaved('Saving…');clearTimeout(saveTimer);saveTimer=setTimeout(flushSave,150)}
  else setSaved('Saved in this browser');
}
function commit(msg){
  const now=JSON.stringify(state);
  if(now===lastJSON)return;
  undoStack.push(lastJSON);if(undoStack.length>50)undoStack.shift();
  lastJSON=now;refreshOff();save();
  document.getElementById('undoBtn').hidden=false;
  if(msg)toast(msg,true);
}
let toastTimer=null;
function toast(msg,withUndo){
  const t=document.getElementById('toast');
  t.innerHTML=`<span>${msg}</span>${withUndo?'<button data-act="undo">Undo</button>':''}`;t.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true},5000);
}
function undo(){
  if(!undoStack.length)return;
  state=normalize(JSON.parse(undoStack.pop()));lastJSON=JSON.stringify(state);refreshOff();save();
  document.getElementById('undoBtn').hidden=!undoStack.length;
  toast('Undone');
}

/* ---------- job math ---------- */
const station=id=>state.stations.find(s=>s.id===id);
const typeOf=j=>state.types.find(t=>t.id===j.type)||state.types[0];
const midSize=t=>t.sizes[Math.floor((t.sizes.length-1)/2)];
/* the size comes from how many cabinets (or pieces) the job has */
const tierOf=j=>{const z=[...typeOf(j).sizes].sort((a,b)=>num(a.max,9999)-num(b.max,9999));return z.find(x=>j.count<=num(x.max,9999))||z[z.length-1]};
const sizeLabel=j=>parts(j).map(partLabel).join(' + ');
/* a job can hold several parts (a kitchen plus baths, a hood, a mantel); the first part is the job's own type and count */
const parts=j=>[j,...(j.extra||[])];
const partLabel=p=>{const t=typeOf(p);return t.sizes.length>1&&tierOf(p).name?`${tierOf(p).name} ${t.name.toLowerCase()}`:t.name};
const unitsText=j=>{const by=new Map();for(const p of parts(j)){const u=typeOf(p).unit;by.set(u,(by.get(u)||0)+num(p.count))}return [...by].map(([u,n])=>plural(n,u)).join(', ')};
const paintedTotal=j=>parts(j).reduce((a,p)=>a+num(p.painted),0);
/* paint or stain (Ayden, Oct 2026): set on the job; older jobs count as painted when any of it is */
const COATS=[['','No paint or stain'],['paint','Paint'],['stain','Stain']];
const coatOf=j=>['','paint','stain'].includes(j.coat)?j.coat:(paintedTotal(j)>0?'paint':'');
const coatName=j=>coatOf(j)==='stain'?'Stain':'Paint';
const levelOf=j=>{const L=state.settings.complexity||[];return L.find(x=>x.id===j.complexity)||L[0]||{id:'low',name:'Low',pct:0}};
/* higher complexity stretches the usual days, rounded up to a quarter day */
const stretch=(j,d)=>{const f=1+num(levelOf(j).pct)/100;return d>0&&f!==1?Math.ceil(d*f*4-1e-9)/4:d};
const installDaysAuto=j=>stretch(j,parts(j).reduce((a,p)=>a+num(tierOf(p).installDays,1),0));
const installDays=j=>j.installDays!=null&&j.installDays!==''?num(j.installDays,1):installDaysAuto(j);
/* days for a shop step: set by the job's size; paint shrinks when only part of the job is painted */
function partDays(p,s,whole){
  const d=num(tierOf(p).days[s]);
  if(s!=='paint')return d;
  if(whole)return d; /* painted or stained, with no count of which pieces: the whole job */
  if(num(p.painted)<=0||d<=0)return 0;
  const share=p.count>0?Math.min(1,p.painted/p.count):1;
  return Math.max(0.5,Math.ceil(d*share*2)/2);
}
function autoDays(j,s){const whole=s==='paint'&&paintedTotal(j)===0;return stretch(j,Math.round(parts(j).reduce((a,p)=>a+partDays(p,s,whole),0)*100)/100)}
const hasDays=(j,s)=>j.days&&j.days[s]!=null&&j.days[s]!=='';
const stepDays=(j,s)=>hasDays(j,s)?num(j.days[s]):autoDays(j,s);
/* one trip for the whole job, so the longest part's delivery time */
const deliveryAuto=j=>Math.max(...parts(j).map(p=>num(typeOf(p).hours.delivery)));
function stageHours(j,s){
  if(s==='delivery')return j.hours&&j.hours.delivery!=null&&j.hours.delivery!==''?num(j.hours.delivery):deliveryAuto(j);
  return r1(stepDays(j,s)*num(station(s).hoursPerDay,8));
}
const daysText=d=>`${d} ${d===1?'day':'days'}`;
function applies(j,s){
  if(s==='install')return !!j.install;
  if(s==='delivery')return !!j.deliver;
  if(s==='finish')return !!j.install&&stageHours(j,s)>0;
  if(s==='paint')return !!coatOf(j)&&stageHours(j,s)>0;
  return stageHours(j,s)>0;
}
function matQty(j,m){
  const x=parts(j).reduce((a,p)=>{const u=typeOf(p).mats[m.id]||{};return a+num(u.u)*num(p.count)+num(u.p)*num(p.painted)},0);
  if(x<=0)return 0;
  return m.unit==='gal'?Math.ceil(x*2)/2:Math.ceil(x);
}

/* ---------- scheduler: forward, finite capacity, jobs in priority order ---------- */
/* install crews: each crew handles one job a day; a half-day visit uses half a crew-day */
/* installs (Ayden, Oct 2026): leave a gap before the last day, since something always needs recutting or repainting after
   the first day or two. Days dragged one by one on the calendar (dates) are used as they are. */
function bookCrew(used,from,days,pinned,gap=0,dates=null){
  const crews=Math.max(1,Math.floor(num(state.settings.installCrews,1))),left=d=>crews-(used['install|'+d]||0);
  days=Math.max(0.5,days);
  const hs=[];for(let r=days;r>0.001;r-=1)hs.push(Math.min(1,r));
  const fits=(x,h)=>left(x)>=h-0.001,take=(x,h)=>{used['install|'+x]=(used['install|'+x]||0)+h;return {d:x,h}};
  if(Array.isArray(dates)&&dates.length===hs.length&&dates.every(isDate)){const ds=[...dates].sort();return {start:ds[0],end:ds[ds.length-1],segs:ds.map((x,k)=>take(x,hs[k])),byHand:true}}
  const split=gap>0&&hs.length>1,head=split?hs.slice(0,-1):hs;
  let d=nextWork(pinned||from);
  if(!pinned){let g=0;while(g++<500){let ok=true,x=d;for(const h of head){if(!fits(x,h)){ok=false;break}x=nextWork(addDays(x,1))}if(ok)break;d=nextWork(addDays(d,1))}}
  const segs=[];let x=d;
  head.forEach((h,k)=>{segs.push(take(x,h));if(k<head.length-1)x=nextWork(addDays(x,1))});
  if(split){const h=hs[hs.length-1];let y=addWork(x,gap+1),g=0;if(!pinned)while(!fits(y,h)&&g++<500)y=nextWork(addDays(y,1));segs.push(take(y,h));x=y}
  return {start:d,end:x,segs};
}
/* deliver on the first install day: the shop's setting, or the job's own choice */
const sameDay=j=>j.sameDay!=null?!!j.sameDay:state.settings.deliverWithInstall!==false;
function installDay(j,used,from,cap,hours){
  if(Array.isArray(j.installDates)&&j.installDates.length)return nextWork([...j.installDates].sort()[0]);
  if(isDate(j.installStart))return nextWork(j.installStart);
  const gap=Math.max(0,Math.round(num(state.settings.installGap)));let c=from;
  for(let g=0;g<60;g++){
    const d=bookCrew({...used},c,installDays(j),null,gap,null).start;
    if(cap-(used['delivery|'+d]||0)>=hours-0.001)return d;
    c=nextWork(addDays(d,1));
  }
  return from;
}
/* Ayden, Nov 7 2026: install dates are only ever set by hand. A job without one gets its shop work planned,
   but the schedule never picks an install day (or a same-day delivery, or finish) for it. */
function installSet(j){
  if(Array.isArray(j.installDates)&&j.installDates.some(isDate))return [...j.installDates].filter(isDate).sort()[0];
  if(isDate(j.installStart))return j.installStart;
  if(j.fixed&&Array.isArray(j.fixed.install)){const d=j.fixed.install.filter(g=>g&&isDate(g.d)).map(g=>g.d).sort()[0];if(d)return d}
  return null;
}
const needsInstallDate=j=>applies(j,'install')&&!j.done.install&&!installSet(j);
/* the shop takes jobs in install-date order (jobs that aren't installed go by their promised date), as early as it can */
const shopDate=j=>applies(j,'install')&&!j.done.install?installSet(j):isDate(j.due)?j.due:null;
function schedule(jobs=state.jobs){
  const used={},out={};
  /* a job whose shop days were placed by hand on the Manufacturing tab is booked first, then everything else by install date */
  const byDate=(a,b)=>{const x=shopDate(a)||'9999',y=shopDate(b)||'9999';return x<y?-1:x>y?1:0};
  const order=[...jobs.filter(j=>j.fixed&&!j.hold),...jobs.filter(j=>!(j.fixed&&!j.hold)).sort(byDate)];
  for(const j of order){
    let cursor=nextWork(isDate(j.start)&&j.start>TODAY?j.start:TODAY),conflict=null,afterCnc=cursor,paintReady=null;const stages=[];
    if(j.hold){out[j.id]={stages:[],finish:null,key:null,slack:null,status:'hold',next:null,fixes:[],conflict:null,install:null};continue}
    const noDate=needsInstallDate(j);
    for(const s of STEPS){
      if(!applies(j,s))continue;
      if(noDate&&!j.done[s]&&(s==='install'||s==='finish'||(s==='delivery'&&sameDay(j)&&!(j.pins&&isDate(j.pins.delivery)))))continue;
      if(['delivery','install','finish'].includes(s)&&paintReady){if(paintReady>cursor)cursor=paintReady;paintReady=null}
      if(j.done[s]){stages.push({s,done:true});continue}
      const fx=j.fixed&&Array.isArray(j.fixed[s])&&j.fixed[s].length?j.fixed[s].filter(g=>g&&isDate(g.d)).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0):null;
      if(fx&&fx.length){
        for(const g of fx){const k=(s==='install'?'install':s)+'|'+g.d;used[k]=(used[k]||0)+num(g.h,1)}
        const st={s,start:fx[0].d,end:fx[fx.length-1].d,segs:fx.map(g=>({d:g.d,h:num(g.h,1)})),pinned:true,fixed:true};stages.push(st);
        if(s==='paint')paintReady=addWork(st.end,num(state.settings.paintDryDays));else{cursor=st.end;if(s==='cnc')afterCnc=st.end}
        continue;
      }
      if(s==='install'){
        const pin=isDate(j.installStart)?nextWork(j.installStart):null;
        if(pin&&pin<cursor)conflict={pinned:pin,ready:cursor};
        const b=bookCrew(used,cursor,installDays(j),pin,Math.max(0,Math.round(num(state.settings.installGap))),j.installDates);
        stages.push({s,...b,pinned:!!pin});cursor=b.end;continue;
      }
      const cap=Math.max(0.5,num(station(s).hoursPerDay,8));
      /* a date set by hand (dragged on the calendar) means "not before"; the step after still waits for this one */
      let from=s==='paint'?afterCnc:cursor;
      /* delivery waits for the day the install crew can start, when the truck is free that day too */
      if(s==='delivery'&&sameDay(j)&&applies(j,'install')&&!j.done.install&&!(j.pins&&isDate(j.pins.delivery))&&stageHours(j,s)<=cap)
        {const iday=installDay(j,used,from,cap,stageHours(j,s));if(iday<from&&!conflict)conflict={pinned:iday,ready:from};from=iday}
      const pin=j.pins&&isDate(j.pins[s])&&j.pins[s]>from?j.pins[s]:null;
      let d=nextWork(pin||from),rem=stageHours(j,s),start=null,guard=0;const segs=[];
      while(rem>0.001&&guard++<2000){
        const k=s+'|'+d,u=used[k]||0,avail=j._force?cap:cap-u; /* placing by hand: the day you pick, even if the station is busy */
        if(avail>0.01){const take=Math.min(avail,rem);used[k]=u+take;rem-=take;segs.push({d,h:take});if(!start)start=d}
        if(rem>0.001)d=nextWork(addDays(d,1));
      }
      stages.push({s,start:start||d,end:d,segs,pinned:!!(j.pins&&isDate(j.pins[s]))});
      if(s==='paint')paintReady=addWork(d,num(state.settings.paintDryDays));

    const inst=live.find(x=>x.s==='install');

    const fixes=[];
    for(const f of j.fixups||[]){if(f.done)continue;const b=bookCrew(used,fc,num(f.days,1),isDate(f.date)?f.date:null);fixes.push({f,...b});fc=addDays(b.end,1)}
    const slack=key&&isDate(j.due)?workBetween(key,j.due):null;
    const status=!live.length?(fixes.length?'fixup':'done'):slack==null?'ok':slack<0?'late':slack===0?'risk':'ok';
    out[j.id]={stages,finish,key,slack,status,next:live[0],fixes,conflict,install:inst,noDate};
  }
  return out;
}
function projectMaterials(sch){
  return state.materials.map(m=>{
    const ev=[];
    for(const j of state.jobs){
      const q=matQty(j,m);if(!q||!applies(j,m.step)||j.done[m.step])continue;
      const st=sch[j.id]?.stages.find(x=>x.s===m.step);if(st&&!st.done)ev.push({d:st.start,q,job:j});
    }
    ev.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
    let bal=num(m.onHand),low=bal,firstShort=null,firstLow=null;
    for(const e of ev){bal-=e.q;low=Math.min(low,bal);if(bal<0&&!firstShort)firstShort=e.d;if(bal<num(m.reorder)&&!firstLow)firstLow=e.d}
    let orderBy=(firstShort||firstLow)?addDays(firstShort||firstLow,-num(m.lead)):null;
    if(orderBy)orderBy=prevWork(orderBy);
    if(orderBy&&orderBy<TODAY)orderBy=TODAY;
    const status=firstShort?'short':firstLow?'low':'ok';
    return {m,ev,need:r1(ev.reduce((a,e)=>a+e.q,0)),bal:r1(bal),status,orderBy,orderQty:status==='ok'?0:Math.ceil(num(m.reorder)-low)};
  });
}

/* ---------- shared bits ---------- */
const sv=s=>`var(--s-${s})`;
const PILL={hold:['done','Put away'],late:['bad','Late'],risk:['warn','Tight'],ok:['ok','On time'],done:['done','Finished'],fixup:['warn','Fix-up']};
const pill=s=>`<span class="pill ${PILL[s][0]}">${PILL[s][1]}</span>`;
const when=d=>d===TODAY?'today':fmt(d);
function nextStepText(j,r){
  if(j.hold)return 'Put away: not on the schedule. Drag it from Put away onto a day to place it.';
  if(!r.next&&r.fixes.length)return `Next up: fix-up visit ${when(r.fixes[0].start)}.`;
  if(!r.next)return 'All steps are finished.';
  const n=r.next;
  if(n.s==='install')return `Next up: install, ${when(n.start)}${n.end!==n.start?' to '+fmt(n.end):''}.`;
  return `Next up: ${STEP_NAME[n.s]}, ${when(n.start)}. ${r.install?`Install starts ${fmt(r.install.start)}`:`Ready ${fmt(r.finish)}`}.`;
}
const doneBtn=(j,r,cls)=>j.hold?`<button class="btn primary ${cls}" data-act="unhold" data-id="${j.id}">Put back on the schedule</button>`:r.next?`<button class="btn primary ${cls}" data-act="advance" data-id="${j.id}">${STEP_NAME[r.next.s]} is done</button>`:r.fixes.length?`<button class="btn primary ${cls}" data-act="advance" data-id="${j.id}">Fix-up is done</button>`:'';

function attention(sch,mats){
  const items=[];
  for(const j of state.jobs){const r=sch[j.id];
    if(r.conflict)items.push({c:'bad',p:'Check date',t:`Install for <b>${esc(j.name)}</b> is set for ${fmt(r.conflict.pinned)}, but the cabinets won't be ready until ${fmt(r.conflict.ready)}.`,job:j.id});
    if(r.status==='late')items.push({c:'bad',p:'Late',t:r.install?`<b>${esc(j.name)}</b> can't start install until ${fmt(r.key)}, ${plural(-r.slack,'workday')} after the date you promised (${fmt(j.due)}).`:`<b>${esc(j.name)}</b> will be ready ${fmt(r.key)}, ${plural(-r.slack,'workday')} after the date you promised (${fmt(j.due)}).`,job:j.id});
    else if(r.status==='risk')items.push({c:'warn',p:'Tight',t:`<b>${esc(j.name)}</b> is ready right on the promised day (${fmt(j.due)}). Any delay makes it late.`,job:j.id});
    for(const [a,b] of orderIssues(j,r)){const A=r.stages.find(x=>x.s===a),B=r.stages.find(x=>x.s===b);
      items.push({c:'warn',p:'Check date',t:`<b>${esc(j.name)}</b>: ${a==='paint'?coatName(j):STEP_NAME[a]} is set for ${fmt(A.start)}, before ${b==='paint'?coatName(j).toLowerCase():STEP_NAME[b].toLowerCase()} is done (${fmt(B.end)}). Drag one of them, or leave it if that's right.`,job:j.id})}
    for(const x of r.fixes)items.push({c:'warn',p:'Fix-up',t:`<b>${esc(j.name)}</b>: ${esc(x.f.note||'fix-up visit')}, ${when(x.start)}.`,job:j.id});
  }
  const nd=state.jobs.filter(j=>sch[j.id]&&sch[j.id].noDate&&!j.hold);
  if(nd.length)items.push({c:'warn',p:'Install date',t:nd.length<=2?nd.map(j=>`<b>${esc(j.name)}</b> needs an install date${sch[j.id].finish?` (the shop can have it ready ${fmt(sch[j.id].finish)})`:''}.`).join(' '):`<b>${nd.length} jobs</b> need an install date: ${nd.slice(0,5).map(j=>esc(j.name)).join(', ')}${nd.length>5?' and more':''}. Drag each onto a day on the Calendar.`,job:nd.length<=2?nd[0].id:null,cal:nd.length>2});
  items.push(...billAlerts());
  for(const x of cdPending())items.push({c:'warn',p:'New job',t:`Cabinet Designer sent <b>${esc(x.d.job.name||'a job')}</b>: ${cdText(x)}.`,cd:x.path});
  const ord=mats.filter(x=>x.status!=='ok').sort((a,b)=>a.orderBy<b.orderBy?-1:1);
  if(ord.length){const now=ord.filter(x=>x.orderBy===TODAY);
    items.push({c:ord.some(x=>x.status==='short')?'bad':'warn',p:'Order',mat:1,t:now.length?`Order <b>${plural(now.length,'material')} today</b>: ${now.map(x=>esc(x.m.name)).join(', ')}.${ord.length>now.length?` ${ord.length-now.length} more soon.`:''}`:`Order ${esc(ord[0].m.name)} by <b>${fmt(ord[0].orderBy)}</b>.${ord.length>1?` ${ord.length-1} more soon.`:''}`});}
  if(!items.length)return `<ul class="alerts"><li class="ok"><span class="pill ok">All good</span><span>Every job is on time and you have the materials you need.</span></li></ul>`;
  const shown=allAlerts?items:items.slice(0,3);
  return `<ul class="alerts">${shown.map(i=>`<li class="${i.c}"><span class="pill ${i.c}">${i.p}</span><span>${i.t}</span>${i.job?`<button class="btn sm" data-act="open" data-id="${i.job}">Open</button>`:i.cal?`<button class="btn sm" data-act="tab" data-id="calendar">Calendar</button>`:i.bill?`<button class="btn sm" data-act="calshow" data-id="bills">Bills</button>`:i.cd?`<button class="btn sm" data-act="cdadd" data-id="${esc(i.cd)}">${cdMatch(cdInbox.find(x=>x.path===i.cd)||{d:{job:{}}})?'Update counts':'Add to schedule'}</button>`:`<button class="btn sm" data-act="tab" data-id="materials">Materials</button>`}</li>`).join('')}</ul>
    ${items.length>3?`<button class="more" data-act="allalerts">${allAlerts?'Show fewer':`Show ${items.length-3} more`}</button>`:''}`;
}
function exampleBanner(){
  if(!state.jobs.some(j=>j.example))return '';
  return `<div class="banner"><span>Showing <b>example jobs</b> so you can see how it works.</span><button class="btn sm" data-act="clearex">Remove examples</button></div>`;
}

/* ---------- bills ---------- */
/* Bills sit on the calendar next to (or instead of) the jobs so work can be planned around them.
   A bill has one due date and can repeat; "paid" is kept per date so each month is ticked off on its own. */
const REPEATS=[['none','Once'],['weekly','Every week'],['biweekly','Every 2 weeks'],['monthly','Every month'],['yearly','Every year']];
const money=n=>'$'+num(n).toLocaleString(undefined,{minimumFractionDigits:num(n)%1?2:0,maximumFractionDigits:2});
function billDates(b,from,to){
  const out=[];if(!isDate(b.due))return out;
  if(b.repeat==='none'){if(b.due>=from&&b.due<=to)out.push(b.due);return out}
  const a=parse(b.due),day=a.getDate();
  const at=k=>{
    if(b.repeat==='weekly')return addDays(b.due,7*k);
    if(b.repeat==='biweekly')return addDays(b.due,14*k);
    const y=a.getFullYear()+(b.repeat==='yearly'?k:0),m=a.getMonth()+(b.repeat==='monthly'?k:0);
    const last=new Date(y,m+1,0).getDate();return iso(new Date(y,m,Math.min(day,last)));
  };
  /* start near "from" instead of walking from the first due date */
  const per=b.repeat==='weekly'?7:b.repeat==='biweekly'?14:b.repeat==='monthly'?30.4:365.25;
  let k=Math.max(0,Math.floor((parse(from)-a)/864e5/per)-1),g=0;
  for(let d=at(k);d<=to&&g++<800;d=at(++k))if(d>=from)out.push(d);
  return out;
}
const billPaid=(b,d)=>(b.paid||[]).includes(d);
/* every unpaid bill from 60 days back, and everything coming up in the next "ahead" days */
function billList(ahead){
  const from=addDays(TODAY,-60),to=addDays(TODAY,ahead),out=[];
  for(const b of state.bills||[])for(const d of billDates(b,from,to))if(d>=TODAY||!billPaid(b,d))out.push({b,d,paid:billPaid(b,d)});
  return out.sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:0);
}
/* a bill due on a day the calendar doesn't show (Sunday, or Saturday when the shop is closed) shows on the day before */
function billShowDay(d){let x=d,g=0;const sat=state.settings.saturdays;while(g++<3){const w=parse(x).getDay();if(w===0||(w===6&&!sat))x=addDays(x,-1);else break}return x}
function billSide(){
  const list=billList(45),due30=list.filter(x=>!x.paid&&x.d<=addDays(TODAY,30)).reduce((a,x)=>a+num(x.b.amount),0);
  const over=list.filter(x=>!x.paid&&x.d<TODAY);
  const b=selBill&&(state.bills||[]).find(x=>x.id===selBill);
  const P=b?`bills.${b.id}`:'';
  const editor=b?`<div class="billedit">
      <label class="f">Bill<input type="text" id="bill-name" data-path="${P}.name" value="${esc(b.name)}" placeholder="e.g. Shop rent"></label>
      <div class="two"><label class="f">Amount<input type="number" id="bill-amt" min="0" step="0.01" data-path="${P}.amount" data-kind="num" value="${num(b.amount)||''}" placeholder="0"></label>
      <label class="f">Due<input type="date" id="bill-due" data-path="${P}.due" value="${esc(b.due)}"></label></div>
      <label class="f">Repeats<select id="bill-rep" data-path="${P}.repeat">${REPEATS.map(([v,l])=>`<option value="${v}" ${b.repeat===v?'selected':''}>${l}</option>`).join('')}</select></label>
      <label class="f">Notes<input type="text" id="bill-notes" data-path="${P}.notes" value="${esc(b.notes||'')}" placeholder="Account, how it's paid…"></label>
      <div class="row"><button class="btn sm primary" data-act="billdone">Done</button><button class="btn sm danger${armed==='b'+b.id?' armed':''}" data-act="delbill" data-id="${b.id}">${armed==='b'+b.id?'Click again to delete':'Delete bill'}</button></div></div>`:'';
  const rows=list.map(x=>`<div class="brow${x.paid?' paid':''}${!x.paid&&x.d<TODAY?' late':''}">
      <input type="checkbox" ${x.paid?'checked':''} data-ui="billpaid" data-id="${x.b.id}" data-date="${x.d}" aria-label="Paid: ${esc(x.b.name)} ${fmt(x.d)}">
      <button class="bt" data-act="billpick" data-id="${x.b.id}"><b>${esc(x.b.name)}</b><span class="small muted">${x.d===TODAY?'Today':fmt(x.d)}${!x.paid&&x.d<TODAY?' · overdue':''}</span></button>
      <span class="amt">${money(x.b.amount)}</span></div>`).join('');
  return `<aside class="panel side"><div class="row spread"><h2>Bills</h2><button class="btn primary sm" data-act="addbill">+ Add bill</button></div>
    <div class="btotal"><span>Unpaid through ${fmtS(addDays(TODAY,30))}${over.length?', including overdue':''}</span><b>${money(due30)}</b></div>
    ${over.length?`<p class="note err">${plural(over.length,'bill')} overdue.</p>`:''}
    ${editor}
    <div class="jside">${rows||'<p class="note">No bills yet. Add rent, payroll, loans or supplier accounts to see them on the calendar.</p>'}</div>
    <p class="note">Tick a bill when it's paid. Drag a bill on the calendar to move its date.</p></aside>`;
}
function billAlerts(){
  const out=[];
  for(const x of billList(3))if(!x.paid){
    if(x.d<TODAY)out.push({c:'bad',p:'Bill',t:`<b>${esc(x.b.name)}</b> (${money(x.b.amount)}) was due ${fmt(x.d)} and isn't marked paid.`,bill:1});
    else out.push({c:'warn',p:'Bill',t:`<b>${esc(x.b.name)}</b> (${money(x.b.amount)}) is due ${when(x.d)}.`,bill:1});
  }
  return out;
}

/* ---------- calendar ---------- */
/* The Calendar tab shows what happens at the customer's: delivery, install, fix-ups and promised dates (and bills).
   The Manufacturing tab is the same calendar with the shop steps: CNC, edgebanding, paint and assembly. */
const SITE_STEPS=['delivery','install','finish','fixup'],MFG_STEPS=['cnc','edge','paint','assembly'];
const STEP_SHORT={cnc:'CNC',edge:'Edgeband',paint:'Paint',assembly:'Assembly',delivery:'Delivery',install:'Install',finish:'Finish',fixup:'Fix-up'};
function viewCalendar(sch,mats,mode='site'){
  /* Ayden, Nov 7 2026: a switch to see just installs and deliveries, with finish, fix-ups, promised dates and bills hidden */
  const shop=mode==='shop',slim=!shop&&calSlim,keep=shop?MFG_STEPS:slim?['delivery','install']:SITE_STEPS;
  const cols=state.settings.saturdays?6:5;
  const monday=x=>{while(parse(x).getDay()!==1)x=addDays(x,-1);return x};
  let d,end,mFirst=null,mLast=null;
  if(monthOff!=null){const t=parse(TODAY),a=new Date(t.getFullYear(),t.getMonth()+monthOff,1),b=new Date(t.getFullYear(),t.getMonth()+monthOff+1,0);
    mFirst=iso(a);mLast=iso(b);d=monday(mFirst);end=addDays(monday(mLast),6)}
  else{d=addDays(monday(TODAY),weekOff*7);end=addDays(d,WEEKS*7-1)}
  const first=d;
  const byDay={},showJobs=shop||slim||calShow!=='bills',showBills=!shop&&!slim&&calShow!=='jobs';
  if(showBills)for(const b of state.bills||[])for(const x of billDates(b,addDays(first,-2),addDays(end,2))){const k=billShowDay(x);(byDay[k]=byDay[k]||[]).push({bill:b,date:x,paid:billPaid(b,x),pri:2000})}
  if(showJobs)state.jobs.forEach((j,pri)=>{const r=sch[j.id];
    const per={};
    const part={};
    for(const st of r.stages)if(!st.done&&keep.includes(st.s))st.segs.forEach((g,k)=>{(per[g.d]=per[g.d]||[]).push(st.s);if(st.s==='install'&&st.segs.length>1)part[g.d]=` ${k+1}/${st.segs.length}`});
    const pinned=new Set(r.stages.filter(st=>!st.done&&st.segs.length&&(st.pinned||(st.s==='install'&&isDate(j.installStart)))).map(st=>st.start+'|'+st.s));
    if(!shop&&!slim)for(const x of r.fixes)for(const g of x.segs)(per[g.d]=per[g.d]||[]).push('fixup');
    for(const k in per){const ss=[...new Set(per[k])];(byDay[k]=byDay[k]||[]).push({j,ss,pri:shop?pri:(ss.includes('install')?0:ss.includes('delivery')?100:200)*1000+pri,pin:ss.some(s=>pinned.has(k+'|'+s)),part:part[k]||''})}
    if(!shop&&!slim&&isDate(j.due)&&r.status!=='done'&&r.status!=='fixup')(byDay[j.due]=byDay[j.due]||[]).push({j,due:true,late:r.status==='late',pri:1000+pri});
  });
  const dows=['Mon','Tue','Wed','Thu','Fri','Sat'].slice(0,cols).map(x=>`<div class="dow">${x}</div>`).join('');
  let cells='';
  while(d<=end){
    const dow=parse(d).getDay();
    if(dow!==0&&(dow!==6||cols===6)){
      const items=(byDay[d]||[]).sort((a,b)=>a.pri-b.pri),off=OFF.has(d);
      const chips=items.map(it=>it.bill
        ?`<button class="chip bill${it.paid?' paid':''}${!it.paid&&it.date<TODAY?' late':''}${selBill===it.bill.id?' sel':''}" data-act="billpick" data-id="${it.bill.id}" data-drag="bill" data-day="${d}" title="${esc(it.bill.name||'Bill')}: ${money(it.bill.amount)} due ${fmt(it.date)}${it.paid?' (paid)':''}. Drag to move it."><span>${esc(it.bill.name||'Bill')}</span><em>${money(it.bill.amount)}</em></button>`
        :it.due
        ?`<button class="chip due${it.late?' late':''}${focusJob===it.j.id?' sel':''}" data-act="focus" data-id="${it.j.id}" data-drag="due" data-day="${d}" title="${esc(it.j.name)}: promised ${it.j.install?'install':'ready'} date${it.late?' (late)':''}. Drag to change it. Double-click to open the job."><span>⚑ ${esc(it.j.name)}</span></button>`
        :`<button class="chip${focusJob===it.j.id?' sel':''}" style="background:${sv(it.ss[0])}" data-act="focus" data-id="${it.j.id}" data-drag="step" data-stage="${it.ss[0]}" data-stages="${it.ss.join(',')}" data-day="${d}" title="${esc(it.j.name)}: ${it.ss.map(s=>STEP_NAME[s]).join(', ')}${it.pin?' (date set by hand)':''}. Drag to move it. Double-click to open the job."><span>${esc(it.j.name)}</span>${it.pin?'<i class="pin" aria-label="Date set by hand">📌</i>':''}<em>${it.ss.map(s=>s==='paint'?coatName(it.j):STEP_SHORT[s]).join(' + ')}${it.part}</em></button>`).join('');
      cells+=`<div data-drop="${d}" class="day${d<TODAY?' out':''}${mFirst&&(d<mFirst||d>mLast)?' other':''}${d===TODAY?' today':''}${off?' off':''}${items.length||off?'':' empty'}"><div class="num"><span><b>${parse(d).getDate()}</b><span class="dname">${fmt(d)}</span></span>${off?'<span class="closed">Closed</span>':''}</div>${chips}</div>`;
    }
    d=addDays(d,1);
  }
  const title=mFirst?parse(mFirst).toLocaleDateString(undefined,{month:'long',year:'numeric'}):`${fmtS(first)} – ${fmtS(addDays(end,cols===6?-1:-2))}`;
  const nav=monthOff!=null
    ?`<button class="btn" data-act="week" data-id="-1" aria-label="Previous month">‹</button><h2>${title}</h2><button class="btn" data-act="week" data-id="1" aria-label="Next month">›</button><button class="btn sm" data-act="week" data-id="0">This week</button>`
    :`<button class="btn" data-act="week" data-id="-1" aria-label="Earlier weeks">‹</button><h2>${title}</h2><button class="btn" data-act="week" data-id="1" aria-label="Later weeks">›</button>${weekOff?'<button class="btn sm" data-act="week" data-id="0">This week</button>':''}<button class="btn sm" data-act="nextmonth">Next month</button>`;
  const fj=focusJob&&state.jobs.find(j=>j.id===focusJob);
  const focusBar=fj?`<div class="banner"><span>Showing only <b>${esc(fj.name)}</b>. ${nextStepText(fj,sch[fj.id])}</span><span class="row">${doneBtn(fj,sch[fj.id],'')}${handSet(fj)?`<button class="btn" data-act="clearpins" data-id="${fj.id}">Clear dates set by hand</button>`:''}<button class="btn" data-act="open" data-id="${fj.id}">Open job</button><button class="btn" data-act="focus" data-id="${fj.id}">Show all jobs</button></span></div>`:'';
  return `${shop?'':exampleBanner()}
  ${shop?'':`<section class="panel"><h2>Needs attention</h2><div style="display:grid;gap:6px">${attention(sch,mats)}</div></section>`}
  <div class="calwrap"><section class="panel">
    ${shop?'<h2 class="ctitle">Manufacturing</h2>':'<h2 class="ctitle">Deliveries and installs</h2>'}
    <div class="row spread"><div class="calhead">${nav}${clearBtn(sch)}</div>
      ${shop?'':`<div class="row"><button class="btn sm" data-act="calslim" aria-pressed="${slim}" title="Show only installs and deliveries">Installs and deliveries only</button>${slim?'':`<div class="seg" role="group" aria-label="Show on the calendar">${[['jobs','Jobs'],['bills','Bills'],['both','Both']].map(([v,l])=>`<button class="btn sm" data-act="calshow" data-id="${v}" aria-pressed="${calShow===v}">${l}</button>`).join('')}</div>`}</div>`}</div>
    <div class="legend">${showJobs?(shop?MFG_STEPS:keep).map(s=>`<span><i class="dot" style="background:${sv(s)}"></i>${STEP_NAME[s]}</span>`).join('')+(shop||slim?'':'<span style="color:var(--ok);font-weight:700">⚑ Promised date</span>'):''}${showBills?'<span><i class="dot billdot"></i>Bill</span>':''}</div>
    ${focusBar}
    <div class="cal${fj?' focus':''}" style="--cols:${cols}">${dows}${cells}</div>
    <p class="note">${shop?'CNC, edgebanding, paint and assembly. Deliveries and installs are on the Calendar tab.':(slim?'Only installs and deliveries.':'Deliveries, installs and fix-ups.')+' CNC, edgebanding, paint and assembly are on the Manufacturing tab.'} Drag a job to move it (📌 = date you set)${shop?'':'; drag one install day to move just that day'}. Double-click a job to open it.</p>
  </section><div class="sidecol">${showJobs?jobSide(sch,mode):''}${showBills?billSide():''}</div></div>`;
}
/* the current jobs beside the calendar: drag one onto a day to start it there */
/* beside the month, so it's easy to find: puts every scheduled job away to start the month empty */
function clearBtn(sch){
  const n=state.jobs.filter(j=>!['done','hold'].includes(sch[j.id].status)).length;if(!n)return '';
  return `<button class="btn sm${armed==='clearall'?' danger armed':''}" data-act="clearall" title="Take every job off the calendar so you can place them yourself">${armed==='clearall'?`Click again to put all ${n} away`:'Clear the schedule'}</button>`;
}
/* change a job's install days right from the Calendar tab */
function idaysCtl(j){const d=installDays(j);
  return `<div class="idays"><span class="small muted">Install</span><button class="ibtn" data-act="idays" data-id="${j.id}" data-n="-0.5" aria-label="One half day less for ${esc(j.name)}" ${d<=0.5?'disabled':''}>−</button><b class="small">${daysText(d)}</b><button class="ibtn" data-act="idays" data-id="${j.id}" data-n="0.5" aria-label="One half day more for ${esc(j.name)}">+</button></div>`}
function jobSide(sch,mode='shop'){
  const live=state.jobs.filter(j=>!['done','hold'].includes(sch[j.id].status)),held=state.jobs.filter(j=>j.hold);
  const away=held.map(j=>`<button class="jrow held${focusJob===j.id?' sel':''}" data-act="open" data-id="${j.id}" data-drag="job" data-mode="${mode}" title="Drag onto a day to place ${esc(j.name)} there"><i class="dot" style="background:var(--line)"></i><span class="jt"><b>${esc(j.name)}</b><span class="small muted">${esc(typeOf(j).name)}${j.customer?' · '+esc(j.customer):''}</span></span></button>`).join('');
  const rows=[...live].sort((a,b)=>{const x=shopDate(a)||'9999',y=shopDate(b)||'9999';return x<y?-1:x>y?1:0}).map(j=>{const r=sch[j.id],n=r.next,fx=!n&&r.fixes[0];
    const dl=r.stages.find(x=>x.s==='delivery'&&!x.done);
    const what=mode==='site'?[dl?`Delivery ${fmtS(dl.start)}`:'',r.install?`Install ${fmtS(r.install.start)}`:r.noDate?'No install date yet':'',!r.install&&fx?`Fix-up ${when(fx.start)}`:''].filter(Boolean).join(' · ')||(n?`${STEP_NAME[n.s]} ${when(n.start)}`:'')
      :n?`${STEP_NAME[n.s]} ${when(n.start)}`:fx?`Fix-up ${when(fx.start)}`:'';
    return `<button class="jrow${focusJob===j.id?' sel':''}" data-act="focus" data-id="${j.id}" data-drag="job" data-mode="${mode}" title="${mode==='site'?`Drag onto a day to install ${esc(j.name)} then`:`Drag onto a day to start ${esc(j.name)} there`}. Double-click to open it.">
      <i class="dot" style="background:${sv(mode==='site'?(r.install?'install':'delivery'):n?n.s:'fixup')}"></i><span class="jt"><b>${esc(j.name)}</b><span class="small muted">${what}${mode!=='site'&&r.install&&n&&n.s!=='install'?` · install ${fmtS(r.install.start)}`:''}</span></span>
      ${r.status==='late'||r.status==='risk'?pill(r.status):''}</button>${mode==='site'&&r.install?idaysCtl(j):''}`}).join('');
  return `<aside class="panel side"><div class="row spread"><h2>Current jobs</h2><button class="btn primary sm" data-act="new" data-drag="new" title="Click to add a job, or drag onto a day to start it there">+ New job</button></div>
    <p class="note">${mode==='site'?'Drag a job onto a day to set its install date. The shop days are planned around it. Use − and + to change how many days the install takes.':'The shop takes jobs in install-date order, as early as it can. Drag a job onto a day only to force its shop start there.'}</p>
    <div class="jside">${rows||(held.length?'<p class="note">Nothing on the schedule. Drag jobs from Put away onto the days you want.</p>':'<p class="note">No jobs yet. Press New job, or drag it onto a day.</p>')}</div>

}

/* ---------- add many jobs at once ---------- */
/* Paste a list, one job per line: name - client - type - size ("Dalton - ServPro - Finish - Small").
   Type and size are matched by their words, so the parts can come in any order after the name. */
let bulkOpen=false,bulkText='',bulkFix={},bulkDropEx=true;
const SIZE_WORDS=[[/\b(very|extra|x)[\s-]*small\b|\bxs\b|\btiny\b/i,'xs',0],[/\b(very|extra|x)[\s-]*large\b|\bxl\b|\bhuge\b/i,'l',3],[/\bsmall\b|\bsm\b/i,'s',1],[/\bmed(ium)?\b|\bmid\b/i,'m',2],[/\blarge\b|\bbig\b|\blg\b/i,'l',3]];
const TYPE_WORDS=[[/\bhouse|\bhome|whole/i,'house'],[/\bfinish/i,'finish'],[/\bparts?\b/i,'parts'],[/\bcustom/i,'custom'],[/\broom\b/i,'room'],[/\bkitchen/i,'kitchen'],
  [/\bbath|vanit/i,'bath'],[/laundry|mud/i,'laundry'],[/built|entertain/i,'builtin'],[/shel/i,'shelves'],[/\bhood/i,'hood'],[/mantel/i,'mantel'],[/\bother\b/i,'other']];
function sizeWord(s){for(const [re,id,rank] of SIZE_WORDS)if(re.test(s)&&s.trim().split(/\s+/).length<=3)return {id,rank};return null}
function typeWord(s){
  const w=s.trim().toLowerCase();if(!w)return null;
  const exact=state.types.find(t=>t.name.toLowerCase()===w);if(exact)return exact.id;
  for(const [re,id] of TYPE_WORDS)if(re.test(w)&&state.types.some(t=>t.id===id))return id;
  return null;
}
/* the type's size closest to the word: same id or name first, otherwise by rank (very small, small, medium, large) */
function sizeFor(t,sw){
  if(!sw)return midSize(t);
  const nm={xs:'very small',s:'small',m:'medium',l:'large'}[sw.id];
  const hit=t.sizes.find(z=>z.id===sw.id)||t.sizes.find(z=>String(z.name||'').toLowerCase()===nm);if(hit)return hit;
  const z=[...t.sizes].sort((a,b)=>num(a.max,9999)-num(b.max,9999));
  return z[Math.min(z.length-1,Math.round(sw.rank/3*(z.length-1)))];
}
function parseJobList(text){
  const rows=[],seen=new Set();
  for(const line of String(text||'').split(/\r?\n/))for(let frag of line.split(/[.;,](?=\s|$)/)){
    frag=frag.replace(/^\s*(\d+[.)]|[-*•])\s+/,'').trim();if(!frag)continue;
    const f=frag.split(/\s+[-–—]\s+|\t+|\s*\|\s*/).map(x=>x.trim()).filter(Boolean);
    if(f.length<2&&!typeWord(f[0]||''))continue;
    let sw=null,si=-1;for(let k=f.length-1;k>0;k--){const s=sizeWord(f[k]);if(s){sw=s;si=k;break}}
    let ty=null,ti=-1;for(let k=f.length-1;k>0;k--){if(k===si)continue;const t=typeWord(f[k]);if(t){ty=t;ti=k;break}}
    const rest=f.filter((_,k)=>k!==si&&k!==ti);
    const key=frag.toLowerCase();if(seen.has(key))continue;seen.add(key);
    const fix=bulkFix[key]||{};
    const type=state.types.some(t=>t.id===fix.type)?fix.type:ty||(state.types.find(t=>t.id==='custom')||state.types[state.types.length-1]).id;
    const t=state.types.find(x=>x.id===type);
    const size=t.sizes.some(z=>z.id===fix.size)?fix.size:sizeFor(t,sw).id;
    const name=rest[0]||'Untitled job',client=rest[1]||'',extra=rest.slice(2).join(' - ');

/* ---------- jobs sent from Cabinet Designer (hub only) ---------- */
/* Cabinet Designer's "Send to Scheduler" writes a small file per job to Files > Schedules > From Cabinet Designer:
   counts by room. Each new or re-sent file is offered here once; adding it makes a job with one part per room. */
const CD_DIR='Schedules/From Cabinet Designer';
let cdInbox=[],cdSeen=null,cdBusy=false,cdAt=0;
async function loadInbox(){
  if(!HUB||cdBusy||Date.now()-cdAt<3000)return;cdBusy=true;cdAt=Date.now();
  try{
    if(!cdSeen){try{cdSeen=(await Hub.storage.get('cdSeen'))||{}}catch(e){cdSeen={}}if(typeof cdSeen!=='object')cdSeen={}}
    let list=[];try{list=(await Hub.files.list(CD_DIR))||[]}catch(e){list=[]}
    const out=[];
    for(const f of list.filter(f=>f.type!=='dir'&&f.type!=='folder'&&/\.json$/i.test(f.path||f.name||''))){
      try{/* no-store: a re-sent job keeps its file name, so a cached copy would hide the new counts */
        const d=JSON.parse(await (await fetch(Hub.files.url(f.path)+'&_='+Date.now(),{cache:'no-store'})).text());if(d&&d.format==='larkul.schedule-job'&&d.job&&Array.isArray(d.rooms))out.push({path:f.path,d})}catch(e){}
    }
    const before=JSON.stringify(cdPending().map(x=>x.path+x.d.sent));
    cdInbox=out;
    if(state.settings.cdAuto!==false&&cdPending().length){
      const done=cdPending().map(x=>cdApply(x,true));
      commit(`${esc(done.join(', '))} from Cabinet Designer`);render();
    }else if(JSON.stringify(cdPending().map(x=>x.path+x.d.sent))!==before)render();
  }finally{cdBusy=false}
}
const cdPending=()=>cdInbox.filter(x=>cdSeen&&cdSeen[x.path]!==x.d.sent);
const cdMatch=x=>state.jobs.find(j=>j.cd===x.path)||state.jobs.find(j=>!j.example&&j.name.trim().toLowerCase()===String(x.d.job.name||'').trim().toLowerCase());
function cdSeenSet(x){cdSeen[x.path]=x.d.sent;try{Hub.storage.set('cdSeen',cdSeen)}catch(e){}}
/* one part per room that has cabinets; the room's name picks the type (Kitchen, Master bath...), otherwise Room */
function cdParts(d){
  const rooms=d.rooms.filter(r=>num(r.cabinets)>0);
  return (rooms.length?rooms:[{name:'',cabinets:1,painted:0}]).map(r=>{const t=typeWord(r.name||'')||(state.types.some(x=>x.id==='room')?'room':state.types[state.types.length-1].id);
    const c=Math.max(1,Math.round(num(r.cabinets)));return {type:t,count:c,painted:Math.min(c,Math.max(0,Math.round(num(r.painted))))}});
}
function cdApply(x,quiet){
  const d=x.d,ps=cdParts(d),old=cdMatch(x),j=old||newDraft(ps[0].type);
  const counts=Object.fromEntries(COUNT_KEYS.filter(k=>d.totals&&d.totals[k]!=null).map(k=>[k,Math.max(0,Math.round(num(d.totals[k])))]));
  Object.assign(j,{type:ps[0].type,count:ps[0].count,painted:ps[0].painted,extra:ps.slice(1).map(p=>({id:uid('p'),...p})),counts,cd:x.path});
  if(!old){j.name=d.job.name||'Untitled job';j.customer=d.job.customer||'';const t=typeOf(j);j.deliver=!!t.deliver;j.install=!!t.install;
    j.notes=[d.job.notes,'From Cabinet Designer'].filter(Boolean).join('. ');if(state.settings.autoPlace===false)j.hold=true;state.jobs.push(j)}
  cdSeenSet(x);if(quiet)return (old?'Updated ':'Added ')+j.name;selJob=j.id;
  commit(old?`Updated ${esc(j.name)} from Cabinet Designer`:`Added ${esc(j.name)} from Cabinet Designer`);
}
function cdText(x){const t=x.d.totals||{},rooms=x.d.rooms.filter(r=>num(r.cabinets)>0).map(r=>esc(r.name)).join(', ');
  return `${plural(num(t.cabinets),'cabinet')}${num(t.doors)?`, ${plural(num(t.doors),'door')}`:''}${num(t.drawers)?`, ${plural(num(t.drawers),'drawer')}`:''}${rooms?` (${rooms})`:''}`}
function cdBox(){
  const p=cdPending();if(!p.length)return '';
  return `<div class="cdbox"><h3>From Cabinet Designer</h3>${p.map(x=>{const old=cdMatch(x);return `<div class="cdrow"><div><b>${esc(x.d.job.name||'Untitled job')}</b>${x.d.job.customer?` · ${esc(x.d.job.customer)}`:''}<div class="small muted">${cdText(x)}${old?'. Already on the schedule.':''}</div></div>
    <span class="row" style="gap:6px"><button class="btn sm primary" data-act="cdadd" data-id="${esc(x.path)}">${old?'Update counts':'Add to schedule'}</button><button class="btn sm" data-act="cdskip" data-id="${esc(x.path)}">Dismiss</button></span></div>`}).join('')}</div>`;
