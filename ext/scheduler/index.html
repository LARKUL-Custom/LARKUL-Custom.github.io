/* ---------- hub reminders ---------- */
/* each date the schedule cares about gets one reminder; when a date moves the old reminder is completed and a new one added */
let remMap=null,remTimer=null,remBusy=Promise.resolve();
const at=(d,h)=>{const x=parse(d);x.setHours(h,0,0,0);return x.toISOString()};
function wantedReminders(){
  const out={};if(!state.settings.hubReminders)return out;
  const sch=schedule(),all=state.jobs;
  /* example jobs never make reminders, so leave them out of the material count too */
  let mats;try{state.jobs=all.filter(j=>!j.example);mats=projectMaterials(schedule())}finally{state.jobs=all}
  for(const j of state.jobs){
    if(j.example)continue;const r=sch[j.id];if(!r||r.status==='done')continue;
    const who=j.customer?` for ${j.customer}`:'';
    if(r.install&&!j.done.install)out['install:'+j.id]={title:`Install starts: ${j.name}`,due:at(r.install.start,7),notes:`Install${who}, ${fmt(r.install.start)}${r.install.end!==r.install.start?' to '+fmt(r.install.end):''}. From the shop schedule.`};
    if(isDate(j.due)&&r.next)out['due:'+j.id]={title:`Promised ${j.install?'install':'ready'} date: ${j.name}`,due:at(j.due,8),notes:`${r.status==='late'?'Running late on the schedule. ':''}Promised${who}. From the shop schedule.`};
    for(const x of r.fixes)out['fix:'+x.f.id]={title:`Fix-up visit: ${j.name}`,due:at(x.start,7),notes:`${x.f.note||'Fix-up'}${who}. From the shop schedule.`};
  }
  for(const b of state.bills||[]){const x=billDates(b,addDays(TODAY,-30),addDays(TODAY,45)).find(d=>!billPaid(b,d));
    if(x)out['bill:'+b.id]={title:`Bill due: ${b.name||'Bill'} ${money(b.amount)}`,due:at(x,8),notes:`${b.notes?b.notes+'. ':''}From the shop schedule.`}}
  for(const x of mats)if(x.status!=='ok'&&x.orderBy)out['mat:'+x.m.id]={title:`Order ${plural(x.orderQty,x.m.unit)} of ${x.m.name}`,due:at(x.orderBy,8),notes:`${x.status==='short'?'Not enough for scheduled jobs':'Running low'}. Takes ${plural(num(x.m.lead),'day')} to arrive. From the shop schedule.`};
  return out;
}
function syncReminders(){if(!HUB)return;clearTimeout(remTimer);remTimer=setTimeout(()=>{remBusy=remBusy.then(doSync).catch(e=>console.warn('reminders',e))},1500)}
async function doSync(){
  if(!remMap){try{remMap=(await Hub.storage.get('reminders'))||{}}catch(e){remMap={}}if(typeof remMap!=='object')remMap={}}
  const want=wantedReminders();let changed=false,listed=null;
  const idOf=async(old)=>{if(old.id)return old.id;listed=listed||await Hub.reminders.list();const m=(listed||[]).find(x=>x.title===old.title&&x.due===old.due&&!x.done&&!x.completed);return m&&m.id};
  const drop=async k=>{const old=remMap[k];try{const id=await idOf(old);if(id)await Hub.reminders.complete(id)}catch(e){}delete remMap[k];changed=true};
  for(const k of Object.keys(remMap))if(!want[k]||want[k].due!==remMap[k].due||want[k].title!==remMap[k].title)await drop(k);
  for(const [k,w] of Object.entries(want)){
    if(remMap[k])continue;
    const r=await Hub.reminders.add(w);
    remMap[k]={id:r&&(r.id||(r.reminder&&r.reminder.id))||null,due:w.due,title:w.title};changed=true;
  }
  if(changed)await Hub.storage.set('reminders',remMap);
}

/* one proposed change from the chat; returns an error message when it can't be done */
function applyChange(c,ctx){
  const J=state.jobs,n=num(c.number);
  const job=c.job==='new'?ctx.newJob:J.find(j=>j.id===c.job);
  const needJob=!['add_job','add_day_off','remove_day_off','set_station_hours'].includes(c.op);
  if(needJob&&!job)return `no job ${c.job}`;
  const partOf=t=>job.type===t?job:(job.extra||[]).find(p=>p.type===t);
  switch(c.op){
    case 'set_step_days':if(!['cnc','edge','paint','assembly','finish'].includes(c.step))return 'unknown step';job.days=job.days||{};if(n<0)delete job.days[c.step];else job.days[c.step]=n;return;
    case 'set_delivery_hours':job.hours=job.hours||{};if(n<0)delete job.hours.delivery;else job.hours.delivery=n;return;
    case 'set_install_days':job.installDays=n<0?'':n;return;
    case 'set_install_start':job.installStart=isDate(c.date)?c.date:'';delete job.installDates;return;
    case 'set_step_start':{if(c.step==='install'){job.installStart=isDate(c.date)?c.date:'';delete job.installDates;return}
      if(!c.step){job.start=isDate(c.date)?c.date:'';return}
      if(!['cnc','edge','paint','assembly','delivery','finish'].includes(c.step))return 'unknown step';
      job.pins=job.pins||{};if(isDate(c.date))job.pins[c.step]=c.date;else delete job.pins[c.step];return}
    case 'set_promised_date':job.due=isDate(c.date)?c.date:'';return;
    case 'set_complexity':if(!(state.settings.complexity||[]).some(x=>x.id===c.text))return 'unknown complexity';job.complexity=c.text;return;
    case 'mark_step':if(!STEPS.includes(c.step))return 'unknown step';if(!!job.done[c.step]!==!!c.flag)toggleStage(job,c.step);return;
    case 'move_job':{const i=J.indexOf(job);J.splice(i,1);J.splice(Math.max(0,Math.min(J.length,Math.round(n)-1)),0,job);return}
    case 'set_part':{if(!state.types.some(t=>t.id===c.text))return 'unknown job type';const p=partOf(c.text),cnt=Math.max(0,Math.round(n));
      if(p===job){if(cnt>0){job.count=cnt;job.painted=Math.min(job.painted,cnt)}return}
      if(p){if(cnt>0){p.count=cnt;p.painted=Math.min(p.painted,cnt)}else job.extra=job.extra.filter(x=>x!==p);return}
      if(cnt>0)(job.extra=job.extra||[]).push({id:uid('p'),type:c.text,count:cnt,painted:0});return}
    case 'set_painted':{const p=partOf(c.text);if(!p)return 'no such part';p.painted=Math.max(0,Math.min(p.count,Math.round(n)));return}
    case 'set_flag':if(c.step!=='deliver'&&c.step!=='install')return 'unknown setting';job[c.step]=!!c.flag;return;
    case 'add_job':{const first=ctx.batch.find(x=>x.op==='set_part'&&x.job==='new'&&state.types.some(t=>t.id===x.text));
      const j=newDraft(first?first.text:state.types[0].id);delete j.rush;j.name=c.text||'New job';if(isDate(c.date))j.due=c.date;
      if(first&&num(first.number)>0)j.count=Math.round(num(first.number));J.push(j);ctx.newJob=j;return}
    case 'rename_job':if(c.text)job.name=c.text;return;
    case 'add_note':if(c.text)job.notes=[job.notes,c.text].filter(Boolean).join('\n');return;
    case 'add_fixup':(job.fixups=job.fixups||[]).push({id:uid('f'),note:c.text||'',days:[0.5,1,2,3].includes(n)?n:Math.max(0.5,n||1),date:isDate(c.date)?c.date:'',done:false});return;
    case 'add_day_off':if(!isDate(c.date))return 'bad date';if(!state.settings.daysOff.includes(c.date))state.settings.daysOff.push(c.date);return;
    case 'remove_day_off':state.settings.daysOff=state.settings.daysOff.filter(d=>d!==c.date);return;
    case 'set_station_hours':{const s=station(c.step);if(!s||n<=0)return 'unknown station';s.hoursPerDay=n;return}
  }
  return 'unknown change';
}
function applyChat(i){
  const m=chat[i];if(!m||m.applied)return;
  const batch=(m.changes||[]).filter(c=>c.on),ctx={batch,newJob:null},bad=[];
  for(const c of batch){const err=applyChange(c,ctx);if(err)bad.push(`${c.label||c.op} (${err})`)}
  m.applied=true;m.skipped=bad.length?`Skipped: ${bad.join('; ')}`:'';
  saveChat();commit(`Applied ${plural(batch.length-bad.length,'change')} from Claude`);
}

function orderIssues(j,r){

  let prev=null;

function resolve(path){

}

    case 'unlink':job.links=(job.links||[]).filter(x=>x.path!==el.dataset.path);commit('Unlinked file');break;
    case 'delfile':{const p=el.dataset.path;if(armed==='f'+p){armed=null;try{await Hub.files.delete(p);toast('File deleted')}catch(err){toast('Could not delete that file.')}await loadFiles(job.folder)}else armed='f'+p;break}
    case 'openfolder':if(APP){try{await Neutralino.os.execCommand(`explorer "${dataDir.replace(/\//g,'\\')}"`)}catch(err){toast('Could not open the folder.')}}break;
    case 'reset':if(armed==='reset'){state=freshState();state.jobs=exampleJobs();state=normalize(state);armed=null;selJob=null;focusJob=null;commit('Erased everything')}else armed='reset';break;
    default:return;
  }
  if(pointerDown)pendingRender=false;
  render(true);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.classList?.contains('jcard')){selJob=e.target.dataset.id;render(true)}
  if((e.key==='Enter'||e.key===' ')&&e.target.tagName==='LABEL'&&e.target.querySelector('input[type=file]')){e.preventDefault();e.target.querySelector('input[type=file]').click()}
  if(e.key==='Enter'&&typingIn(e.target)&&e.target.tagName==='INPUT'){e.target.dispatchEvent(new Event('change',{bubbles:true}));render(true)}
  if(e.target.id==='chatbox'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){e.preventDefault();undo();render(true)}
});
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;e.stopPropagation();setTab(b.dataset.tab);render(true)});

/* ---------- start ---------- */
async function appLoad(){
  Neutralino.init();
  Neutralino.events.on('windowClose',async()=>{await flushSave();Neutralino.app.exit()});
  const docs=(await Neutralino.os.getPath('documents')).replace(/\\/g,'/');
  dataDir=docs+'/Larkul Schedule';
  for(const d of [dataDir,dataDir+'/backups'])try{await Neutralino.filesystem.createDirectory(d)}catch(e){}
  try{return JSON.parse(await Neutralino.filesystem.readFile(dataPath()))}catch(e){return null}
}
async function boot(){
  let loaded=null;
  if(APP){try{loaded=await appLoad()}catch(e){console.error(e)}}
  if(HUB){try{loaded=await Hub.storage.get('state')}catch(e){console.error(e);setSaved('Could not reach the hub.',true)}
    document.querySelector('#tabs [data-tab="claude"]').hidden=false;
    try{aiSettings={...aiSettings,...((await Hub.storage.get('ai'))||{})};chat=(await Hub.storage.get('chat'))||[]}catch(e){}
    addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushSave();else loadInbox()});setInterval(loadInbox,60000);addEventListener('focus',()=>loadInbox());
    /* the hub hides other tabs instead of closing them; this notices when the Scheduler tab is shown again */
    try{new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting))loadInbox()}).observe(document.getElementById('app'))}catch(e){}addEventListener('pagehide',()=>flushSave())}
  if(!loaded){try{loaded=JSON.parse(localStorage.getItem(KEY))}catch(e){}}
  if(loaded&&loaded.state)loaded=loaded.state;
  if(loaded&&Array.isArray(loaded.jobs))state=normalize(loaded);
  else{
    let old=null;try{old=JSON.parse(localStorage.getItem('larkul-schedule-v3'))}catch(e){}
    if(old&&Array.isArray(old.jobs))state=migrateV3(old);
    else{state=freshState();state.jobs=exampleJobs();state=normalize(state)}
  }
  refreshOff();lastJSON=JSON.stringify(state);
  try{calSlim=localStorage.getItem(KEY+'-slim')==='1'}catch(e){}
  try{const v=localStorage.getItem(KEY+'-show');if(['jobs','bills','both'].includes(v))calShow=v}catch(e){}
  try{const t=localStorage.getItem(KEY+'-tab');if(['calendar','shop','jobs','materials','settings','claude'].includes(t))tab=t}catch(e){}
  if(['calendar','shop','jobs','materials','settings','claude'].includes(location.hash.slice(1)))tab=location.hash.slice(1);
  if(tab==='claude'&&!HUB)tab='calendar';
  const added=addStarterJobs();
  const before=JSON.stringify(state),oct30=applyOct30(),freed=handInstalls(),ticked=autoAdvance();
  /* on a first run, Undo already takes the starter jobs back out in one step */
  if((ticked.length||oct30.length||freed.length)&&!added){undoStack.push(before);document.getElementById('undoBtn').hidden=false}
  save();render(true);loadInbox();
  if(freed.length)setTimeout(()=>toast(`The shop days for ${plural(freed.length,'job')} are planned by the schedule again, around your install dates. Undo puts them back.`,true),added?9000:5600);
  if(oct30.length)setTimeout(()=>toast(`${esc(oct30.join(', '))}: shop work marked done, finishing ${TODAY>OCT30?'done':'today'} (Oct 30). Undo puts them back.`,true),added?4500:300);
  else if(ticked.length)setTimeout(()=>toast(`Marked done since last time: ${esc(ticked.slice(0,4).join(', '))}${ticked.length>4?` and ${ticked.length-4} more`:''}. Click a step on the job to reopen it.`,true),added?4500:300);
  /* left open overnight: start the new day fresh, once nothing is waiting to save */
  setInterval(()=>{if(iso(new Date())!==TODAY&&!savePending&&!pointerDown&&!document.querySelector('input:focus,textarea:focus,select:focus'))location.reload()},10*60000);
  if(added)setTimeout(()=>toast(`Added your ${plural(added,'job')} from Oct 30. Undo takes them back out.`,true),300);
}
boot();
</script>
