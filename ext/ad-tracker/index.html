<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Larkul Ads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" media="print" onload="this.media='all'">
<script src="/hub-sdk.js"></script>
<style>
/* Same look as the Schedule tab: Larkul charcoal header band, white oak and brass */
:root{
  --bg:#f6f4f0; --surface:#ffffff; --sunk:#eeeae3; --ink:#26241f; --muted:#6c665c; --line:#ddd7cc;
  --accent:#2b2925; --accent-ink:#ffffff; --accent-soft:#f1e8d6; --brass:#a6814a;
  --head-bg:#1f1e1b; --head-ink:#f4efe6; --head-muted:#b9ad98;
  --ok:#3d7650; --warn:#9a6410; --bad:#a93b2c; --ok-soft:#e1eee3; --warn-soft:#f5e9cf; --bad-soft:#f6dfd9;
  --f-display:"Marcellus","Palatino Linotype","Times New Roman",serif;
  --f-body:"Nunito Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161513; --surface:#1f1e1b; --sunk:#292723; --ink:#eee9e0; --muted:#a69e90; --line:#3a3732;
  --accent:#d6b47a; --accent-ink:#1a1814; --accent-soft:#3a3122; --brass:#d6b47a;
  --head-bg:#0f0e0d; --head-ink:#f4efe6; --head-muted:#b9ad98;
  --ok:#6cc08a; --warn:#e0a640; --bad:#ec7a68; --ok-soft:#1e3426; --warn-soft:#3a2f17; --bad-soft:#3e211c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161513; --surface:#1f1e1b; --sunk:#292723; --ink:#eee9e0; --muted:#a69e90; --line:#3a3732;
  --accent:#d6b47a; --accent-ink:#1a1814; --accent-soft:#3a3122; --brass:#d6b47a;
  --head-bg:#0f0e0d; --head-ink:#f4efe6; --head-muted:#b9ad98;
  --ok:#6cc08a; --warn:#e0a640; --bad:#ec7a68; --ok-soft:#1e3426; --warn-soft:#3a2f17; --bad-soft:#3e211c;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1300px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--head-bg);color:var(--head-ink);border-bottom:3px solid var(--brass)}
.bar{display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;padding-block:10px}
.brand{margin-right:auto;display:flex;flex-direction:column;line-height:1.1}
.brand .word{font-family:var(--f-display);font-size:28px;letter-spacing:.32em;margin-right:-.32em}
.brand .tag{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--head-muted);margin-top:4px}
.brand .tag b{color:var(--brass)}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{font:700 13px var(--f-body);letter-spacing:.14em;text-transform:uppercase;border:0;border-bottom:2px solid transparent;background:none;color:var(--head-muted);padding:10px 12px;cursor:pointer}
nav button:hover{color:var(--head-ink)}
nav button[aria-selected="true"]{color:var(--head-ink);border-bottom-color:var(--brass)}
.hstat{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--head-muted)}
.hstat .err{color:#ff9d8c;font-weight:700}
.hbtn{font:700 12px var(--f-body);letter-spacing:.1em;text-transform:uppercase;background:none;color:var(--head-ink);border:1px solid var(--head-muted);border-radius:3px;padding:5px 10px;cursor:pointer}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
main{padding-block:20px 80px;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
h2{font-family:var(--f-display);font-weight:400;font-size:24px;letter-spacing:.12em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font-family:var(--f-body);font-weight:800;font-size:12px;letter-spacing:.18em;text-transform:uppercase;margin:0;color:var(--brass)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.grow{flex:1 1 200px;min-width:0}
.muted{color:var(--muted)} .small{font-size:14px}
.note{font-size:14px;color:var(--muted);margin:0}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:3px;cursor:pointer;font-weight:700}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:3px 10px;font-size:14px}
.btn.danger{color:var(--bad)} .btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--brass)}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.done{background:var(--sunk);color:var(--muted)} .pill.place{background:var(--accent-soft);color:var(--ink)}
.banner{background:var(--accent-soft);border-radius:4px;padding:12px 14px;display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
/* numbers across the top */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:grid;gap:6px;align-content:start}
.stat b{font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* limit meters */
.meter{display:grid;gap:3px;font-size:14px}
.meter .lab{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.meter .lab em{font-style:normal;font-weight:700}
.meter .track{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.meter .fill{height:100%;border-radius:4px;background:var(--ok)}
.meter.warn .fill{background:var(--warn)} .meter.warn em{color:var(--warn)}
.meter.bad .fill{background:var(--bad)} .meter.bad em{color:var(--bad)}
/* suggestion list */
.alerts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.alerts li{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 14px;border-radius:4px;background:var(--sunk)}
.alerts li.bad{background:var(--bad-soft)} .alerts li.warn{background:var(--warn-soft)} .alerts li.ok{background:var(--ok-soft)}
.alerts li>span{flex:1 1 260px;min-width:0}
.alerts .acts{display:flex;gap:6px;flex-wrap:wrap;flex:0 1 auto;min-width:0;align-items:center}
.alerts .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px}
/* places */
.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;align-content:start;min-width:0}
.pcard.bad{border-left:5px solid var(--bad)} .pcard.warn{border-left:5px solid var(--warn)}
.pcard .nm{font-weight:800;font-size:17px;overflow-wrap:anywhere}
.facts{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.facts b{color:var(--ink)}
/* ads */
.alist{display:grid;gap:8px}
.ad{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;min-width:0}
.ad.open{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ad .nm{font-weight:800;font-size:17px;overflow-wrap:anywhere;flex:1 1 200px;min-width:0}
.ad .what{margin:0;font-size:14px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.ad select.status{width:auto;padding:4px 8px}
.leads{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:3px}
.leads button{border:0;background:none;padding:3px 10px;cursor:pointer;font-weight:800}
.leads b{padding:0 6px;min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
.quickadd{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) minmax(0,.7fr) minmax(0,.8fr) auto;gap:10px;align-items:end}
@media (max-width:800px){.quickadd{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.quickadd .wide{grid-column:1/-1}}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.form .wide{grid-column:1/-1}
label.f{display:grid;gap:4px;font-size:14px;font-weight:700;color:var(--muted);align-content:start}
label.f small{font-weight:400}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=url],select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:3px;padding:8px 10px;color:var(--ink);width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap}
details summary{cursor:pointer;font-weight:700;color:var(--muted)}
details[open] summary{margin-bottom:8px}
.scroll{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:700}
td input{max-width:160px}
/* stats */
table.nums td,table.nums th{white-space:nowrap;font-variant-numeric:tabular-nums}
table.nums td.best{color:var(--ok);font-weight:800}
table.nums tr.total td{font-weight:800;border-top:2px solid var(--line)}
table.nums th button{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline dotted}
table.nums th button[aria-pressed="true"]{color:var(--ink);text-decoration:underline}
.hint{background:var(--sunk);border-radius:4px;padding:10px 14px;font-size:14px;color:var(--muted)}
/* ideas */
.chat{display:grid;gap:12px;max-height:70vh;overflow-y:auto;padding-right:4px}
.msg{display:grid;gap:10px;max-width:880px}
.msg.me{justify-self:end;background:var(--accent);color:var(--accent-ink);border-radius:12px 12px 2px 12px;padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.ai>p{margin:0;background:var(--sunk);border-radius:12px 12px 12px 2px;padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere;justify-self:start}
.msg.ai>small{color:var(--muted)}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.idea{display:grid;gap:8px;align-content:start;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--brass);border-radius:4px;padding:12px 14px;min-width:0}
.idea .nm{font-weight:800;font-size:16px;overflow-wrap:anywhere}
.idea p{margin:0;font-size:14px;overflow-wrap:anywhere}
.idea .why{color:var(--muted);font-style:italic}
.idea.tried{border-top-color:var(--ok)} .idea.skip{opacity:.6;border-top-color:var(--line)}
.star{background:none;border:0;cursor:pointer;font-size:20px;line-height:1;color:var(--brass);padding:0 4px}
.composer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}
.composer textarea{min-height:52px}
.thinking{color:var(--muted);font-style:italic}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--head-bg);color:var(--head-ink);border:1px solid var(--brass);border-radius:4px;padding:10px 14px;display:flex;gap:14px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--brass);font-weight:800;cursor:pointer;text-transform:uppercase;letter-spacing:.1em;font-size:13px}
.toast.bad{border-color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.btn,.ad,.pcard{transition:border-color .15s}}
</style>
</head>
<body>

<header><div class="wrap bar">
  <div class="brand"><span class="word">LARKUL</span><span class="tag">Advertising · <b>Experimental</b></span></div>
  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="overview">Overview</button>
    <button role="tab" data-tab="ads">Ads</button>
    <button role="tab" data-tab="stats">Stats</button>
    <button role="tab" data-tab="ideas">Ideas</button>
    <button role="tab" data-tab="places">Places</button>
    <button role="tab" data-tab="settings">Settings</button>
  </nav>
  <div class="hstat"><button id="undoBtn" class="hbtn" data-act="undo" hidden>Undo</button><span id="saveState"></span></div>
</div></header>
<div class="wrap"><main id="app"><p class="note">Loading your ads…</p></main></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
'use strict';
/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const TODAY=iso(new Date()),MONTH=TODAY.slice(0,7),WEEK_START=addDays(TODAY,-6);
const isDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);
const num=(v,d=0)=>{const n=parseFloat(v);return Number.isFinite(n)?n:d};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
const money=n=>{n=num(n);return n.toLocaleString(undefined,{style:'currency',currency:'USD',minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})};
const fmt=s=>isDate(s)?parse(s).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'—';
const ago=s=>{if(!isDate(s))return 'never';const d=daysBetween(s,TODAY);return d<=0?(d===0?'today':`in ${plural(-d,'day')}`):d===1?'yesterday':`${d} days ago`};
const optNum=v=>v===''||v==null||!Number.isFinite(parseFloat(v))?null:Math.max(0,Math.round(parseFloat(v)));
const pct=x=>x==null?'—':(x*100<10?(x*100).toFixed(1):Math.round(x*100))+'%';
const big=n=>n==null?'—':n>=10000?Math.round(n/1000)+'k':n.toLocaleString();
const monthName=parse(TODAY).toLocaleDateString(undefined,{month:'long'});

const STATUS={live:'Live',paused:'Paused',draft:'Not out yet',ended:'Ended'};
const KINDS=['Social','Search & maps','Listing site','Print','Sign','Email','Word of mouth','Other'];
/* places most shops like ours advertise; offered as one-click adds */
const COMMON=[['Google Business Profile','Search & maps'],['Facebook','Social'],['Instagram','Social'],['Nextdoor','Social'],['Houzz','Listing site'],['Yelp','Listing site'],
  ['Facebook Marketplace','Listing site'],['Craigslist','Listing site'],['Yard signs','Sign'],['Truck or trailer','Sign'],['Flyers & door hangers','Print'],['Local paper','Print']];

/* ---------- state ---------- */
const KEY='larkul-ads-v1';
const HUB=typeof window.Hub!=='undefined'&&!!Hub.id;
let state=freshState(),tab='overview',openAd=null,armed=null,q='',af='active',pf='',importText='';
let period='90',statBy='place',statSort='cpl',planBudget=null,chatText='',thinking=false,aiStatus=null,ideaFilter='new';
const TABS=['overview','ads','stats','ideas','places','settings'];
let undoStack=[],lastJSON='',saveTimer=null,savePending=false;

function freshState(){return{v:1,settings:{monthlyBudget:0,warnAt:80,quietDays:21,snoozeDays:14},places:[],ads:[],ideas:[],chat:[],dismissed:{}}}
function normIdea(i){return{id:i.id||uid('i'),title:String(i.title||'Untitled idea').slice(0,200),place:String(i.place||'').slice(0,100),what:String(i.what||'').slice(0,3000),
  why:String(i.why||'').slice(0,1000),cost:Math.max(0,num(i.cost)),status:['new','tried','skip'].includes(i.status)?i.status:'new',starred:!!i.starred,added:isDate(i.added)?i.added:TODAY,adId:i.adId||''}}
function normPlace(p){return{id:p.id||uid('p'),name:String(p.name||'New place'),kind:KINDS.includes(p.kind)?p.kind:'Other',link:String(p.link||''),notes:String(p.notes||''),
  budget:Math.max(0,num(p.budget)),perWeek:Math.max(0,Math.round(num(p.perWeek))),maxLive:Math.max(0,Math.round(num(p.maxLive))),archived:!!p.archived,example:!!p.example}}
function normAd(a,places){return{id:a.id||uid('a'),title:String(a.title||'Untitled ad'),body:String(a.body||''),link:String(a.link||''),notes:String(a.notes||''),
  placeId:places.some(p=>p.id===a.placeId)?a.placeId:'',status:STATUS[a.status]?a.status:'draft',cost:Math.max(0,num(a.cost)),
  start:isDate(a.start)?a.start:'',end:isDate(a.end)?a.end:'',example:!!a.example,
  runs:(Array.isArray(a.runs)?a.runs:[]).filter(r=>r&&isDate(r.date)).map(r=>({id:r.id||uid('r'),date:r.date,cost:Math.max(0,num(r.cost)),views:optNum(r.views),clicks:optNum(r.clicks)})),
  wins:(Array.isArray(a.wins)?a.wins:[]).filter(w=>w&&isDate(w.date)).map(w=>({id:w.id||uid('w'),date:w.date,amount:Math.max(0,num(w.amount))})),
  leads:(Array.isArray(a.leads)?a.leads:[]).filter(isDate)}}
function normalize(st){
  const f=freshState();st=st&&typeof st==='object'?st:{};
  const places=(Array.isArray(st.places)?st.places:[]).filter(p=>p&&typeof p==='object').map(normPlace);
  const s={...f.settings,...(st.settings||{})};
  for(const k of Object.keys(f.settings))s[k]=Math.max(0,num(s[k],f.settings[k]));
  if(!s.warnAt||s.warnAt>100)s.warnAt=f.settings.warnAt;
  return{v:1,settings:s,places,ads:(Array.isArray(st.ads)?st.ads:[]).filter(a=>a&&typeof a==='object').map(a=>normAd(a,places)),
    ideas:(Array.isArray(st.ideas)?st.ideas:[]).filter(i=>i&&typeof i==='object').map(normIdea),
    chat:(Array.isArray(st.chat)?st.chat:[]).filter(m=>m&&(m.role==='user'||m.role==='assistant')).slice(-40).map(m=>({role:m.role,text:String(m.text||''),deck:!!m.deck,ideas:(Array.isArray(m.ideas)?m.ideas:[]).map(normIdea)})),
    dismissed:Object.fromEntries(Object.entries(st.dismissed&&typeof st.dismissed==='object'?st.dismissed:{}).filter(([,d])=>isDate(d)&&daysBetween(d,TODAY)<90))};
}

function exampleData(){
  const d=n=>addDays(TODAY,n),P=(name,kind,o={})=>({id:uid('p'),name,kind,example:true,...o});
  const fb=P('Facebook','Social',{budget:150,perWeek:3}),gbp=P('Google Business Profile','Search & maps',{perWeek:2}),
    nd=P('Nextdoor','Social',{perWeek:2}),sign=P('Yard signs','Sign',{budget:80,maxLive:6}),hz=P('Houzz','Listing site',{budget:60});
  const A=(placeId,title,o={})=>({id:uid('a'),placeId,title,example:true,status:'live',start:d(-40),...o});
  const r=(n,cost,views,clicks)=>({date:d(n),cost,views,clicks});
  return{places:[fb,gbp,nd,sign,hz],ads:[
    A(fb.id,'Painted kitchen before/after',{body:'Before and after photos of the white shaker kitchen. "Free in-home measure this month."',cost:40,
      runs:[r(-25,40,3100,52),r(-12,40,2800,61),r(-5,40,3400,70),r(-2,40,1900,33)],leads:[d(-24),d(-11),d(-4)],wins:[{date:d(-6),amount:14500}]}),
    A(fb.id,'Shop tour video',{cost:25,runs:[r(-30,25,2600,18),r(-1,25,1200,7)],leads:[]}),
    A(gbp.id,'Weekly project photos',{cost:0,runs:[r(-9,0,640,29),r(-3,0,580,31)],leads:[d(-8),d(-6),d(-2)],wins:[{date:d(-1),amount:6200}]}),
    A(nd.id,'Neighborhood intro post',{cost:0,runs:[r(-38,0,900,22)],leads:[d(-36)]}),
    A(sign.id,'Job site signs',{body:'"Cabinets by LARKUL" with phone number',cost:18,runs:[{date:d(-20),cost:72}],leads:[d(-15)]}),
    A(hz.id,'Pro listing',{cost:60,status:'paused',runs:[r(-34,60,450,6)],leads:[]}),
    A(fb.id,'Holiday built-ins promo',{status:'draft',start:'',cost:30})]};
}

function setSaved(text,err){const el=document.getElementById('saveState');el.textContent=text;el.className=err?'err':''}
async function flushSave(){
  if(!HUB||!savePending)return;
  clearTimeout(saveTimer);savePending=false;
  try{await Hub.storage.set('state',{app:'larkul-ads',version:1,saved:new Date().toISOString(),state});setSaved('Saved')}
  catch(e){console.error(e);savePending=true;setSaved('Could not save to the hub. Is it still running?',true)}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
  if(HUB){savePending=true;setSaved('Saving…');clearTimeout(saveTimer);saveTimer=setTimeout(flushSave,150)}
  else setSaved('Saved in this browser');
}
function commit(msg,bad){
  const now=JSON.stringify(state);
  if(now===lastJSON){if(msg)toast(msg,false,bad);return}
  undoStack.push(lastJSON);if(undoStack.length>50)undoStack.shift();
  lastJSON=now;save();
  document.getElementById('undoBtn').hidden=false;
  if(msg)toast(msg,true,bad);
}
let toastTimer=null;
function toast(msg,withUndo,bad){
  const t=document.getElementById('toast');
  t.innerHTML=`<span>${msg}</span>${withUndo?'<button data-act="undo">Undo</button>':''}`;t.hidden=false;t.classList.toggle('bad',!!bad);
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true},bad?9000:5000);
}
function undo(){
  if(!undoStack.length)return;
  state=normalize(JSON.parse(undoStack.pop()));lastJSON=JSON.stringify(state);save();
  document.getElementById('undoBtn').hidden=!undoStack.length;
  toast('Undone');
}

/* ---------- numbers ---------- */
const placeOf=a=>state.places.find(p=>p.id===a.placeId);
const placeName=a=>{const p=placeOf(a);return p?p.name:'No place'};
const adSpent=(a,from='',to='9')=>a.runs.reduce((s,r)=>r.date>=from&&r.date<=to?s+r.cost:s,0);
const lastRun=a=>a.runs.reduce((m,r)=>r.date>m?r.date:m,'');
const inMonth=d=>d.slice(0,7)===MONTH;
function placeStats(p){
  const ads=state.ads.filter(a=>a.placeId===p.id);
  const s={ads,month:0,all:0,week:0,runs:0,last:'',leads:0,leadsMonth:0,live:ads.filter(a=>a.status==='live').length};
  for(const a of ads){
    s.leads+=a.leads.length;s.leadsMonth+=a.leads.filter(inMonth).length;
    for(const r of a.runs){s.all+=r.cost;s.runs++;if(inMonth(r.date))s.month+=r.cost;if(r.date>=WEEK_START&&r.date<=TODAY)s.week++;if(r.date>s.last)s.last=r.date}
  }
  s.cpl=s.leads?s.all/s.leads:null;
  return s;
}
const adsAt=p=>state.ads.filter(a=>a.placeId===p.id);
/* totals and rates for some ads between two dates; a rate is null until there is something to divide by */
function tally(ads,from='',to='9'){
  const t={spent:0,runs:0,views:0,clicks:0,tracked:0,cvViews:0,cvClicks:0,leads:0,wins:0,revenue:0};
  for(const a of ads){
    for(const r of a.runs){
      if(r.date<from||r.date>to)continue;
      t.spent+=r.cost;t.runs++;
      if(r.views!=null)t.views+=r.views;
      if(r.clicks!=null)t.clicks+=r.clicks;
      if(r.views!=null||r.clicks!=null)t.tracked++;
      if(r.views!=null&&r.clicks!=null){t.cvViews+=r.views;t.cvClicks+=r.clicks}
    }
    t.leads+=a.leads.filter(d=>d>=from&&d<=to).length;
    for(const w of a.wins)if(w.date>=from&&w.date<=to){t.wins++;t.revenue+=w.amount}
  }
  t.ctr=t.cvViews>0?t.cvClicks/t.cvViews:null;
  t.conv=t.clicks>0?t.leads/t.clicks:null;
  t.close=t.leads>0?t.wins/t.leads:null;
  t.cpc=t.clicks>0&&t.spent>0?t.spent/t.clicks:null;
  t.cpl=t.leads>0?t.spent/t.leads:null;
  t.cpj=t.wins>0?t.spent/t.wins:null;
  t.roi=t.spent>0&&t.revenue>0?t.revenue/t.spent:null;
  return t;
}
const periodFrom=()=>period==='month'?MONTH+'-01':period==='90'?addDays(TODAY,-89):'';
const PERIODS=[['month',`This month`],['90','Last 90 days'],['all','All time']];
const totalMonth=()=>state.ads.reduce((s,a)=>s+a.runs.reduce((t,r)=>inMonth(r.date)?t+r.cost:t,0),0);
const leadsMonth=()=>state.ads.reduce((s,a)=>s+a.leads.filter(inMonth).length,0);
/* every limit that is set, with how much of it is used: lvl is ok, warn (at or past the warning line) or bad (over) */
function level(used,limit){const r=used/limit;return r>1?'bad':r>=state.settings.warnAt/100?'warn':'ok'}
function placeLimits(p,s=placeStats(p)){
  const out=[];
  if(p.budget>0)out.push({key:'budget',label:`Spent in ${monthName}`,used:s.month,limit:p.budget,show:`${money(s.month)} of ${money(p.budget)}`,lvl:level(s.month,p.budget)});
  if(p.perWeek>0)out.push({key:'perWeek',label:'Put out in the last 7 days',used:s.week,limit:p.perWeek,show:`${s.week} of ${p.perWeek}`,lvl:level(s.week,p.perWeek)});
  if(p.maxLive>0)out.push({key:'maxLive',label:'Live at once',used:s.live,limit:p.maxLive,show:`${s.live} of ${p.maxLive}`,lvl:level(s.live,p.maxLive)});
  return out;
}
function totalLimit(){const b=state.settings.monthlyBudget,m=totalMonth();return b>0?{key:'total',label:`All ads in ${monthName}`,used:m,limit:b,show:`${money(m)} of ${money(b)}`,lvl:level(m,b)}:null}
const worst=ls=>ls.some(l=>l.lvl==='bad')?'bad':ls.some(l=>l.lvl==='warn')?'warn':'ok';
/* a snapshot of every limit, to tell what an edit pushed near or over */
function limitSnap(){const m={};for(const p of state.places)for(const l of placeLimits(p))m[p.id+l.key]={...l,place:p.name};const t=totalLimit();if(t)m.total={...t,place:'All places'};return m}
function limitWarning(before){
  const after=limitSnap(),rank={ok:0,warn:1,bad:2};
  const hit=Object.entries(after).filter(([k,l])=>l.lvl!=='ok'&&rank[l.lvl]>rank[(before[k]||{lvl:'ok'}).lvl]);
  if(!hit.length)return null;
  const [,l]=hit.sort((a,b)=>rank[b[1].lvl]-rank[a[1].lvl])[0];
  return{bad:l.lvl==='bad',text:`${l.lvl==='bad'?'Over the limit':'Near the limit'}: ${esc(l.place)}, ${esc(l.label.toLowerCase())} is ${esc(l.show)}.`};
}

/* ---------- suggestions ---------- */
function suggestions(){
  const S=state.settings,out=[],add=(key,lvl,text,acts=[])=>{const d=state.dismissed[key];if(d&&daysBetween(d,TODAY)<S.snoozeDays)return;out.push({key,lvl,text,acts})};
  const t=totalLimit();
  if(t&&t.lvl!=='ok')add('total-'+MONTH+t.lvl,t.lvl,t.lvl==='bad'?`You are over your ${monthName} ad budget: ${esc(t.show)}. Pause something or raise the budget in Settings.`:`You have used ${Math.round(t.used/t.limit*100)}% of your ${monthName} ad budget (${esc(t.show)}).`,[{act:'tab',id:'settings',label:'Budget'}]);
  const active=state.places.filter(p=>!p.archived);
  const stats=new Map(active.map(p=>[p.id,placeStats(p)]));
  for(const p of active){
    const s=stats.get(p.id);
    for(const l of placeLimits(p,s)){
      if(l.lvl==='ok')continue;
      const what=l.key==='budget'?(l.lvl==='bad'?`spent ${money(l.used-l.limit)} more than its ${money(l.limit)} monthly limit`:`has used ${money(l.used)} of its ${money(l.limit)} monthly budget`)
        :l.key==='perWeek'?(l.lvl==='bad'?`had ${plural(l.used,'post')} this week, over its limit of ${l.limit}. Posting too often can wear people out.`:`is at ${esc(l.show)} posts for the week. Hold off a few days.`)
        :(l.lvl==='bad'?`has ${l.used} live ads, over its limit of ${l.limit}. Pause or end one.`:`has ${esc(l.show)} live ads allowed.`);
      add(`lim-${p.id}-${l.key}-${l.lvl}-${l.key==='budget'?MONTH:TODAY}`,l.lvl,`<b>${esc(p.name)}</b> ${what}`,[{act:'place',id:p.id,label:'See ads'}]);
    }
  }
  for(const a of state.ads)if(a.status==='live'&&a.end&&a.end<TODAY)
    add('end-'+a.id,'warn',`<b>${esc(a.title)}</b> on ${esc(placeName(a))} was set to end ${fmt(a.end)} but is still marked live.`,[{act:'setstatus',id:a.id,n:'ended',label:'Mark ended'},{act:'edit',id:a.id,label:'Edit'}]);
  for(const p of active){
    const s=stats.get(p.id);
    if(s.last&&daysBetween(s.last,TODAY)>=S.quietDays){
      const latest=[...s.ads].filter(a=>a.status!=='ended').sort((a,b)=>lastRun(b)<lastRun(a)?-1:1)[0];
      add('quiet-'+p.id+s.last,'',`Nothing new on <b>${esc(p.name)}</b> in ${daysBetween(s.last,TODAY)} days.${s.leads?` It has brought ${plural(s.leads,'lead')} so far.`:''} Put something out again?`,
        latest?[{act:'run',id:latest.id,label:`Put “${esc(latest.title)}” out again`}]:[{act:'newfor',id:p.id,label:'New ad here'}]);
    }else if(!s.runs&&!s.ads.length)add('unused-'+p.id,'',`You added <b>${esc(p.name)}</b> but haven't tracked an ad there yet.`,[{act:'newfor',id:p.id,label:'Add an ad'}]);
    if(s.runs>=3&&s.all>0&&!s.leads)add('nolead-'+p.id+s.runs,'warn',`<b>${esc(p.name)}</b> has had ${plural(s.runs,'run')} and ${money(s.all)} spent with no leads yet. Try a different ad there, or move that money somewhere that works.`,[{act:'place',id:p.id,label:'See ads'}]);
  }
  /* where leads come cheapest, among places with at least 2 leads */
  const ranked=active.map(p=>({p,s:stats.get(p.id)})).filter(x=>x.s.leads>=2).sort((a,b)=>a.s.cpl-b.s.cpl);
  if(ranked.length){
    const best=ranked[0],left=t?t.limit-t.used:null,room=best.p.budget>0?best.p.budget-best.s.month:null;
    if(best.s.cpl===0)add('free-'+best.p.id+MONTH,'ok',`<b>${esc(best.p.name)}</b> is free and has brought ${plural(best.s.leads,'lead')}. Post there more often${best.p.perWeek?` (up to ${best.p.perWeek} a week)`:''}.`);
    else if((left==null||left>0)&&(room==null||room>0))add('best-'+best.p.id+MONTH,'ok',`<b>${esc(best.p.name)}</b> brings leads for the least: about ${money(Math.round(best.s.cpl))} each.${left!=null?` You have ${money(left)} left this month.`:''} Put more there first.`,[{act:'place',id:best.p.id,label:'See ads'}]);
    const worstP=ranked.length>1?ranked[ranked.length-1]:null;
    if(worstP&&worstP.s.cpl>best.s.cpl*3&&worstP.s.cpl>0)add('worst-'+worstP.p.id+MONTH,'',`Leads from <b>${esc(worstP.p.name)}</b> cost about ${money(Math.round(worstP.s.cpl))} each, more than 3 times ${esc(best.p.name)}.`,[{act:'place',id:worstP.p.id,label:'See ads'}]);
  }
  /* an ad that does far better than the rest at the same place */
  for(const a of state.ads){
    if(a.status!=='live'||a.leads.length<3)continue;
    const others=state.ads.filter(b=>b!==a&&b.placeId===a.placeId&&b.runs.length);
    const otherRate=others.reduce((s,b)=>s+b.leads.length,0)/Math.max(1,others.reduce((s,b)=>s+b.runs.length,0));
    if(others.length&&a.leads.length/Math.max(1,a.runs.length)>=2*otherRate)add('star-'+a.id,'ok',`<b>${esc(a.title)}</b> gets the most leads per run on ${esc(placeName(a))}. Try the same idea somewhere else.`,[{act:'copy',id:a.id,label:'Copy this ad'}]);
  }
  /* click and conversion rates over the last 90 days, compared with the average across places */
  const from90=addDays(TODAY,-89),rated=active.map(p=>({p,t:tally(adsAt(p),from90)}));
  const all90=tally(state.ads,from90);
  for(const {p,t:x} of rated){
    if(x.cvViews>=1000&&all90.ctr&&x.ctr<all90.ctr/2)add('lowctr-'+p.id+MONTH,'',`People see your <b>${esc(p.name)}</b> ads but few click (${pct(x.ctr)}, your average is ${pct(all90.ctr)}). Try a stronger first photo or headline.`,[{act:'tab',id:'ideas',label:'Get ideas'}]);
    if(x.clicks>=50&&all90.conv&&(x.conv||0)<all90.conv/2)add('lowconv-'+p.id+MONTH,'warn',`<b>${esc(p.name)}</b> gets clicks but few turn into leads (${pct(x.conv||0)} of clicks, your average is ${pct(all90.conv)}). Check the offer and where the link takes people.`,[{act:'place',id:p.id,label:'See ads'}]);
  }
  const roiBest=rated.filter(x=>x.t.roi!=null&&x.t.wins>=1).sort((a,b)=>b.t.roi-a.t.roi)[0];
  if(roiBest&&roiBest.t.roi>=5)add('roi-'+roiBest.p.id+MONTH,'ok',`Every $1 on <b>${esc(roiBest.p.name)}</b> brought back about ${money(Math.round(roiBest.t.roi))} in jobs over the last 90 days.`,[{act:'tab',id:'stats',label:'See stats'}]);
  const runs90=state.ads.reduce((n,a)=>n+a.runs.filter(r=>r.date>=from90).length,0);
  if(runs90>=5&&!state.ads.some(a=>a.runs.some(r=>r.views!=null||r.clicks!=null)))add('trackclicks','',`Copy views and clicks from each site's insights into your ads (Edit › Each time it went out) to see click and conversion rates for every site.`,[{act:'tab',id:'stats',label:'Stats'}]);
  const drafts=state.ads.filter(a=>a.status==='draft');
  if(drafts.length)add('drafts-'+drafts.length,'',`${plural(drafts.length,'ad')} not out yet: ${drafts.slice(0,3).map(a=>'<b>'+esc(a.title)+'</b>').join(', ')}${drafts.length>3?'…':''}.`,[{act:'filter',id:'draft',label:'Show them'}]);
  const have=new Set(state.places.map(p=>p.name.toLowerCase()));
  const missing=COMMON.filter(([n])=>!have.has(n.toLowerCase())).slice(0,4);
  if(state.places.length&&missing.length)add('common-'+missing.map(m=>m[0]).join(),'',`Places you aren't tracking yet: ${missing.map(m=>esc(m[0])).join(', ')}.`,missing.slice(0,3).map(m=>({act:'addcommon',id:m[0],label:'+ '+esc(m[0])})));
  if(!S.monthlyBudget&&state.ads.some(a=>a.runs.some(r=>r.cost>0)))add('setbudget','',`Set a monthly ad budget to get a warning before you spend too much.`,[{act:'tab',id:'settings',label:'Set budget'}]);
  const order={bad:0,warn:1,'':2,ok:3};
  return out.sort((a,b)=>order[a.lvl]-order[b.lvl]);
}

const meter=l=>`<div class="meter ${l.lvl}"><div class="lab"><span>${esc(l.label)}</span><em>${esc(l.show)}</em></div><div class="track"><div class="fill" style="width:${Math.min(100,Math.round(l.used/l.limit*100))}%"></div></div></div>`;

};

function viewAdForm(a){

function statRows(){
  const from=periodFrom();
  if(statBy==='ad')return state.ads.filter(a=>a.runs.some(r=>r.date>=from)||a.leads.some(d=>d>=from))
    .map(a=>({key:a.id,label:`${esc(a.title)} <span class="small muted">${esc(placeName(a))}</span>`,ads:[a],t:tally([a],from)}));
  const rows=state.places.map(p=>({key:p.id,label:esc(p.name)+(p.archived?' <span class="small muted">(stopped)</span>':''),ads:adsAt(p)}));
  const loose=state.ads.filter(a=>!placeOf(a));
  if(loose.length)rows.push({key:'',label:'<span class="muted">No place</span>',ads:loose});
  return rows.map(r=>({...r,t:tally(r.ads,from)})).filter(r=>r.t.runs||r.t.leads||r.t.wins);
}
function viewStats(){
  const rows=statRows(),col=COLS.find(c=>c[0]===statSort)||COLS[9];
  const sv=r=>col[3](r.t);
  rows.sort((a,b)=>{const x=sv(a),y=sv(b);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return col[4]==='lo'?x-y:y-x});
  /* the best value in each column, when at least two rows have one */
  const best={};
  for(const [k,,,val,dir] of COLS){if(!dir)continue;const v=rows.map(r=>val(r.t)).filter(x=>x!=null&&!(dir==='hi'&&x===0));if(v.length>1)best[k]=dir==='lo'?Math.min(...v):Math.max(...v)}
  const total=tally(rows.flatMap(r=>r.ads),periodFrom());

  </section>
  ${viewPlan()}`;
}
/* splits a month's ad money: most to the places that bring leads cheapest, a little to try places without enough data, none to places that spent and got nothing */
function plan(budget){
  const from=addDays(TODAY,-89);
  const rows=state.places.filter(p=>!p.archived).map(p=>({p,t:tally(adsAt(p),from),amount:0,kind:''}));
  const all=tally(state.ads,from),avgCpl=all.cpl||null;
  for(const r of rows){
    if(r.t.spent===0&&r.t.leads>0)r.kind='free';
    else if(r.t.spent>0&&r.t.leads>=2)r.kind='proven';
    else if(r.t.spent>0&&avgCpl&&r.t.spent>2*avgCpl)r.kind='pause';
    else r.kind='test';
  }
  const tests=rows.filter(r=>r.kind==='test'),proven=rows.filter(r=>r.kind==='proven');
  let left=budget;
  if(tests.length){const pool=Math.min(budget*(proven.length?0.2:1),tests.length*Math.max(budget*0.1,25));for(const r of tests){r.amount=Math.min(pool/tests.length,r.p.budget||Infinity)}left-=tests.reduce((s,r)=>s+r.amount,0)}
  let open=proven.slice();
  for(let i=0;i<5&&left>1&&open.length;i++){
    const w=open.reduce((s,r)=>s+1/r.t.cpl,0);
    for(const r of open)r.amount+=left*(1/r.t.cpl)/w;
    left=0;
    for(const r of open)if(r.p.budget&&r.amount>r.p.budget){left+=r.amount-r.p.budget;r.amount=r.p.budget}
    open=open.filter(r=>!r.p.budget||r.amount<r.p.budget);
  }
  for(const r of rows)r.amount=Math.floor(r.amount/5)*5;
  return{rows:rows.sort((a,b)=>b.amount-a.amount||(a.kind==='free'?-1:1)),left:budget-rows.reduce((s,r)=>s+r.amount,0)};
}
function viewPlan(){
  const def=state.settings.monthlyBudget||Math.round(tally(state.ads,addDays(TODAY,-29)).spent/10)*10||'';
  const b=planBudget==null?def:planBudget;
  const out=num(b)>0?plan(num(b)):null;
  const why=r=>r.kind==='proven'?`About ${money(Math.round(r.t.cpl))} a lead${r.t.ctr!=null?`, ${pct(r.t.ctr)} click rate`:''}${r.p.budget&&r.amount>=r.p.budget?'. Capped at its limit':''}`
    :r.kind==='free'?`Free, and brought ${plural(r.t.leads,'lead')}. Keep posting${r.p.perWeek?` (up to ${r.p.perWeek} a week)`:''}`
    :r.kind==='pause'?`${money(r.t.spent)} spent, ${plural(r.t.leads,'lead')}. Pause it or try a new ad first`
    :r.t.runs?'Not enough data yet, so a small test':'Never tried, so a small test';
  return`<section class="panel"><h2>Where to put next month's money</h2>
    <p class="note">Based on your last 90 days. Most goes where leads come cheapest, a little goes to testing sites without enough data, and nothing goes to sites that spent and got no leads.</p>
    <div class="row"><label class="f" style="max-width:220px">Money to spend<input type="number" min="0" step="any" inputmode="decimal" id="planbudget" value="${esc(b)}" placeholder="$"></label></div>
    ${!out?'<p class="note">Type how much you want to spend.</p>':!out.rows.some(r=>r.kind==='proven'||r.kind==='test')?'<p class="note">Track a few ads with what they cost and the leads they bring first.</p>':`

      ${out.rows.map(r=>`<tr><td>${esc(r.p.name)}</td><td>${r.kind==='free'?'Free':money(r.amount)}</td><td>${r.kind==='proven'&&r.amount?'about '+Math.round(r.amount/r.t.cpl*10)/10:r.kind==='free'?'—':'?'}</td><td style="white-space:normal">${esc(why(r))}</td></tr>`).join('')}

    </tbody></table></div>`}
  </section>`;
}

/* data-path is like "ads.<id>.title" or "ads.<id>.runs.<runId>.cost" or "settings.warnAt" */
function resolve(path){
  const segs=path.split('.');let o=state;
  for(const s of segs.slice(0,-1)){if(o==null)return null;o=Array.isArray(o)?o.find(x=>x&&x.id===s):o[s]}
  return o==null?null:[o,segs[segs.length-1]];
}
function applyField(el){
  const r=resolve(el.dataset.path);if(!r)return null;
  const [o,f]=r,k=el.dataset.kind;
  let v=el.value;
  if(k==='num')v=Math.max(0,num(v));
  if(k==='int')v=Math.max(0,Math.round(num(v)));
  if(k==='opt')v=optNum(v);
  if(el.type==='date'&&!isDate(v))v=f==='date'?o[f]:'';
  if(f==='title'||f==='name')v=v.trim()||o[f];
  if(f==='warnAt')v=Math.min(100,Math.max(1,v));
  o[f]=v;return{o,f};
}

  const w=limitWarning(before);
  commit(w?w.text:r.f==='status'&&r.o.runs?`${esc(r.o.title)} is now ${STATUS[r.o.status].toLowerCase()}`:'',w&&w.bad);
  if(!el.isConnected)return;

});

function addPlace(name,kind='Other'){
  name=name.trim();if(!name)return null;
  const old=state.places.find(p=>p.name.toLowerCase()===name.toLowerCase());
  if(old){old.archived=false;return old}
  const p=normPlace({name,kind});state.places.push(p);return p;
}
function putOut(a,date=TODAY,cost=a.cost){
  const before=limitSnap();
  a.runs.push({id:uid('r'),date,cost});
  if(a.status!=='live')a.status='live';
  if(!a.start)a.start=date;
  return limitWarning(before);
}

    addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushSave()});addEventListener('pagehide',()=>flushSave())}
  if(!loaded){try{loaded=JSON.parse(localStorage.getItem(KEY))}catch(e){}}
  if(loaded&&loaded.state)loaded=loaded.state;
  state=normalize(loaded);
  lastJSON=JSON.stringify(state);
  try{const t=localStorage.getItem(KEY+'-tab');if(TABS.includes(t))tab=t}catch(e){}
  if(TABS.includes(location.hash.slice(1)))tab=location.hash.slice(1);
  if(!loaded)setSaved(HUB?'':'Saved in this browser');
  render(true);
}
boot();
</script>
